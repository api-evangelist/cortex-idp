openapi: 3.2.0
info:
  description: The Cortex REST API provides programmatic access to the data in the catalog, Scorecards, and more.
  title: Cortex Catalog Entities API
  version: v1
servers:
- url: https://api.getcortexapp.com
  description: Cortex Cloud API host
security:
- bearerAuth: []
tags:
- name: Catalog Entities
paths:
  /api/v1/catalog:
    delete:
      description: Deletes the entities with the given IDs.
      operationId: deleteEntitiesByIds
      parameters:
      - description: CIDs of the entities to delete, e.g. `en2da8159dbeefb974`. Entity tags are not accepted.
        in: query
        name: ids
        required: false
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: Successfully deleted entities
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Invalid request
        '405':
          description: Entity delete is not allowed
        '429':
          $ref: '#/components/responses/TooManyRequests'
      summary: Delete entities by ID
      tags:
      - Catalog Entities
      x-cortex-mcp-description: Delete entities by explicit IDs. Disabled for MCP access due to the destructive nature of bulk operations that could remove critical infrastructure components.
      x-cortex-mcp-enabled: 'false'
    get:
      description: 'List all entities across the Service, Resource and Domain Catalogs.


        This API returns summary data for each entity, so refer to the retrieve entity method to lookup more details for a single entity.'
      operationId: listAllEntities
      parameters:
      - description: Filter based on groups, which correspond to the `x-cortex-groups` field in the Catalog Descriptor. Accepts a comma-delimited list of groups
        in: query
        name: groups
        required: false
        schema:
          type: array
          items:
            type: string
          default: []
      - description: Filter based on owner group names. Returns entities owned by the specified groups, as well as entities owned by any child/sub-teams of those groups. Group names correspond to the `x-cortex-owners` field in the Catalog Descriptor. Accepts a comma-delimited list of owner group names.
        in: query
        name: owners
        required: false
        schema:
          type: array
          items:
            type: string
          default: []
      - description: Depth of the parent / children hierarchy nodes to include for each entity. Defaults to 0, which returns no hierarchy data. Pass 'full' to return the entire hierarchy, or a positive integer to limit the depth.
        in: query
        name: hierarchyDepth
        required: false
        schema:
          type: string
          default: '0'
      - description: Filter by git repositories. Supports GitHub (`github:org/repo` or `org/repo`), GitLab (`gitlab:namespace/project` or `gitlab:<project ID>`), Bitbucket (`bitbucket:workspace/repo`), and Azure DevOps (`azure-devops:project/repo`). Unprefixed values default to GitHub for backward compatibility.
        example: cortexapps%2Fbackend,gitlab:my-group%2Fmy-project
        in: query
        name: gitRepositories
        required: false
        schema:
          type: array
          items:
            type: string
          default: []
      - description: List of sub fields to include for hierarchies. Only supports 'groups'
        example: groups
        in: query
        name: includeHierarchyFields
        required: false
        schema:
          type: array
          items:
            type: string
      - description: Filter the response to specific types of entities. By default, this includes services, resources, and domains. Corresponds to the `x-cortex-type` field in the entity descriptor.
        example: service,rds,s3,domain
        in: query
        name: types
        required: false
        schema:
          type: array
          items:
            type: string
          default: []
      - description: Filter based on a [search query](https://docs.cortex.io/settings/search). This will search across entity properties. If provided, results will be sorted by relevance.
        in: query
        name: query
        required: false
        schema:
          type: string
          default: ''
      - description: Whether to include archived entities in the response
        in: query
        name: includeArchived
        required: false
        schema:
          type: boolean
          default: false
      - description: Whether to include custom data for each entity in the response
        in: query
        name: includeMetadata
        required: false
        schema:
          type: boolean
          default: false
      - description: Whether to include links for each entity in the response
        in: query
        name: includeLinks
        required: false
        schema:
          type: boolean
          default: false
      - description: Whether to include Slack channels for each entity in the response
        in: query
        name: includeSlackChannels
        required: false
        schema:
          type: boolean
      - description: Whether to include ownership information for each entity in the response
        in: query
        name: includeOwners
        required: false
        schema:
          type: boolean
          default: false
      - description: List of sub fields to include for different types
        example: team:members
        in: query
        name: includeNestedFields
        required: false
        schema:
          type: array
          items:
            type: string
      - description: Number of results to return per page, between 1 and 1000. Default 250.
        in: query
        name: pageSize
        required: true
        schema:
          type: integer
          format: int32
          default: 250
      - description: Page number to return, 0-indexed. Default 0.
        in: query
        name: page
        required: true
        schema:
          type: integer
          format: int32
          default: 0
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListCatalogEntities'
          description: Successfully found entities
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Invalid filters
        '429':
          $ref: '#/components/responses/TooManyRequests'
      summary: List entities
      tags:
      - Catalog Entities
      x-cortex-mcp-description: List and enumerate catalog entities by structured filters (groups, types, owners, git repositories) with pagination. To find or search for entities by name, relevance, team, or domain, use searchCatalog instead.
      x-cortex-mcp-enabled: 'true'
  /api/v1/catalog/batch/{type}:
    get:
      description: Gets a list of entities based on type and batch key plus identifier
      operationId: getEntitiesByBatchIdentifier
      parameters:
      - description: The type name of the batches to retrieve. This corresponds to the `x-cortex-type` field in the entity descriptor.
        in: path
        name: type
        required: true
        schema:
          type: string
      - description: The batch key to filter entities by. This is a custom field set as entity metadata `__cortex_batch.key`
        in: query
        name: key
        required: true
        schema:
          type: string
      - description: The batch version. This is a custom field set as entity metadata `__cortex_batch.identifier`, required if `compare` is specified
        in: query
        name: version
        required: false
        schema:
          type: string
      - description: The type over comparison to perform. Ignored unless `version` parameter must also be provided.  Values can be `eq`, `ne`.
        in: query
        name: compare
        required: false
        schema:
          type: string
      - in: query
        name: includeArchived
        required: false
        schema:
          type: boolean
          default: false
      - description: Number of results to return per page, between 1 and 1000. Default 250.
        in: query
        name: pageSize
        required: true
        schema:
          type: integer
          format: int32
          default: 250
      - description: Page number to return, 0-indexed. Default 0.
        in: query
        name: page
        required: true
        schema:
          type: integer
          format: int32
          default: 0
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityCIDListResponse'
          description: List of entity identifiers matching the batch key and type, based on the specified compare parameter.
        '429':
          $ref: '#/components/responses/TooManyRequests'
      summary: Get entities by batch identifier
      tags:
      - Catalog Entities
      x-cortex-mcp-enabled: 'false'
  /api/v1/catalog/descriptors:
    get:
      description: 'List entity descriptors


        The descriptors do not include objects (e.g. custom data, dependencies, etc) defined via the API'
      operationId: listEntityDescriptors
      parameters:
      - description: When true, returns the YAML representation of the descriptors
        in: query
        name: yaml
        schema:
          type: boolean
      - description: Filter the response to specific types of entities. By default, this includes services, resources, and domains. Corresponds to the `x-cortex-type` field in the entity descriptor.
        example: service,rds,s3,domain
        in: query
        name: types
        required: false
        schema:
          type: array
          items:
            type: string
      - description: Number of entities to return per page
        in: query
        name: pageSize
        required: true
        schema:
          type: integer
          format: int32
      - description: Page number to return, 0 indexed
        in: query
        name: page
        required: true
        schema:
          type: integer
          format: int32
      - description: Whether to include archived entities in the response
        in: query
        name: includeArchived
        required: false
        schema:
          type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/YamlDescriptorsListResponse'
                - $ref: '#/components/schemas/JsonDescriptorsListResponse'
          description: Successfully retrieved entity descriptors
        '429':
          $ref: '#/components/responses/TooManyRequests'
      summary: List entity descriptors
      tags:
      - Catalog Entities
      x-cortex-mcp-description: List the Cortex descriptors of many entities, with pagination. Returns JSON by default; pass yaml=true for the YAML form. Filter with types, and set includeArchived to reach archived entities.
      x-cortex-mcp-enabled: 'true'
  /api/v1/catalog/search:
    get:
      description: Relevance-ranked catalog search. Returns a lean, hydrated result set scoped by query and/or filters.
      operationId: searchCatalog
      parameters:
      - description: Relevance search text. Plain words work; AND/OR/NOT supported.
        in: query
        name: query
        required: false
        schema:
          type: string
      - description: Restrict to entity types, e.g. service, domain, team, resource.
        in: query
        name: types
        required: false
        schema:
          type: array
          items:
            type: string
      - description: Owner team tags. Returns entities owned by these teams, including their sub-teams.
        in: query
        name: owners
        required: false
        schema:
          type: array
          items:
            type: string
      - description: Domain tags. Returns entities in these domains, including their sub-domains.
        in: query
        name: domains
        required: false
        schema:
          type: array
          items:
            type: string
      - description: Catalog slug. Scopes the search to that catalog's entities.
        in: query
        name: catalog
        required: false
        schema:
          type: string
      - description: 0-indexed page number.
        in: query
        name: page
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - description: Results per page, 1-100.
        in: query
        name: pageSize
        required: false
        schema:
          type: integer
          format: int32
          default: 25
      - in: query
        name: includeArchived
        required: false
        schema:
          type: boolean
          default: false
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogSearchResponse'
          description: OK
        '429':
          $ref: '#/components/responses/TooManyRequests'
      summary: Search entities
      tags:
      - Catalog Entities
      x-cortex-mcp-description: Search the catalog for entities (services, domains, teams, resources), ranked by relevance. This is the primary way to find entities. Put search text in `query` (plain words work; AND/OR/NOT supported). Scope with `types` (e.g. service, domain, team); `owners` to get everything a team owns, including its sub-teams; `domains` to get everything within a domain, including its sub-domains; or `catalog` (a catalog slug). Returns a lean result per entity (cid, tag, type, name, description, owner emails, owning team tags, groups, status); `groups` are the free-form x-cortex-groups tags used to organize the catalog. Use getEntityDetails for the full record of a single entity.
      x-cortex-mcp-enabled: 'true'
  /api/v1/catalog/{tagOrId}:
    delete:
      operationId: deleteEntity
      parameters:
      - description: The tag (`x-cortex-tag`) or unique, auto-generated identifier (CID) for the entity. If the tag contains forward slashes, URL-encode each `/` as `%2F`. The tag is matched exactly as encoded, including leading, trailing, and consecutive slashes, which are preserved and not collapsed (for example, the tag `/services/payments-api` is referenced as `%2Fservices%2Fpayments-api`). Tags containing slashes are supported via the API but not in the Cortex UI; this difference is expected.
        in: path
        name: tagOrId
        required: true
        schema:
          type: string
          description: Entity identifier - can be a tag or CID
      responses:
        '200':
          description: Successfully deleted entity
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Entity not found
        '405':
          description: Entity delete is not allowed
        '429':
          $ref: '#/components/responses/TooManyRequests'
      summary: Delete entity
      tags:
      - Catalog Entities
      x-cortex-mcp-description: Delete an entity from the catalog. This operation is disabled for MCP access due to its destructive nature.
      x-cortex-mcp-enabled: 'false'
    get:
      operationId: getEntityDetails
      parameters:
      - description: The tag (`x-cortex-tag`) or unique, auto-generated identifier (CID) for the entity. If the tag contains forward slashes, URL-encode each `/` as `%2F`. The tag is matched exactly as encoded, including leading, trailing, and consecutive slashes, which are preserved and not collapsed (for example, the tag `/services/payments-api` is referenced as `%2Fservices%2Fpayments-api`). Tags containing slashes are supported via the API but not in the Cortex UI; this difference is expected.
        in: path
        name: tagOrId
        required: true
        schema:
          type: string
          description: Entity identifier - can be a tag or CID
      - description: Depth of the parent / children hierarchy nodes. Can be 'full' or a valid integer
        in: query
        name: hierarchyDepth
        required: false
        schema:
          type: string
          default: full
      - description: List of sub fields to include for hierarchies. Only supports 'groups'
        example: groups
        in: query
        name: includeHierarchyFields
        required: false
        schema:
          type: array
          items:
            type: string
      - description: Include ownership information, default is true
        in: query
        name: includeOwners
        required: false
        schema:
          type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailsResponse'
          description: Successfully found entity
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Entity not found
        '429':
          $ref: '#/components/responses/TooManyRequests'
      summary: Retrieve entity details
      tags:
      - Catalog Entities
      x-cortex-mcp-description: Retrieve comprehensive details about a specific entity including its metadata, ownership, hierarchies, and relationships. This is the primary method for getting complete information about services, teams, or domains.
      x-cortex-mcp-enabled: 'true'
  /api/v1/catalog/{tagOrId}/archive:
    put:
      operationId: archiveEntity
      parameters:
      - description: The tag (`x-cortex-tag`) or unique, auto-generated identifier (CID) for the entity. If the tag contains forward slashes, URL-encode each `/` as `%2F`. The tag is matched exactly as encoded, including leading, trailing, and consecutive slashes, which are preserved and not collapsed (for example, the tag `/services/payments-api` is referenced as `%2Fservices%2Fpayments-api`). Tags containing slashes are supported via the API but not in the Cortex UI; this difference is expected.
        in: path
        name: tagOrId
        required: true
        schema:
          type: string
          description: Entity identifier - can be a tag or CID
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailsResponse'
          description: Successfully archived entity
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Entity not found
        '429':
          $ref: '#/components/responses/TooManyRequests'
      summary: Archive an entity
      tags:
      - Catalog Entities
      x-cortex-mcp-description: Archive an entity by tag or CID. Archived entities are hidden from the catalog and from default searches and listings, but nothing is deleted. Archiving an entity that is already archived changes nothing. Reverse it with unarchiveEntity. Returns the entity's full details, and 404 if the entity is not found.
      x-cortex-mcp-enabled: 'true'
  /api/v1/catalog/{tagOrId}/gitops-logs:
    get:
      operationId: latestGitOpsLogForEntity
      parameters:
      - description: The tag (`x-cortex-tag`) or unique, auto-generated identifier (CID) for the entity. If the tag contains forward slashes, URL-encode each `/` as `%2F`. The tag is matched exactly as encoded, including leading, trailing, and consecutive slashes, which are preserved and not collapsed (for example, the tag `/services/payments-api` is referenced as `%2Fservices%2Fpayments-api`). Tags containing slashes are supported via the API but not in the Cortex UI; this difference is expected.
        in: path
        name: tagOrId
        required: true
        schema:
          type: string
          description: Entity identifier - can be a tag or CID
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GitOpsLogEntityResponse'
          description: Retrieve most recent GitOps log for entity
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Entity GitOps log not found
        '429':
          $ref: '#/components/responses/TooManyRequests'
      summary: Retrieve most recent GitOps log for entity
      tags:
      - Catalog Entities
      x-cortex-mcp-enabled: 'false'
  /api/v1/catalog/{tagOrId}/openapi:
    get:
      description: 'Retrieve entity descriptor


        The descriptor does not include objects (e.g. custom data, dependencies, etc) defined via the API'
      operationId: getEntityDescriptor
      parameters:
      - description: When true, returns the YAML representation of the descriptor
        in: query
        name: yaml
        schema:
          type: boolean
      - description: The tag (`x-cortex-tag`) or unique, auto-generated identifier (CID) for the entity. If the tag contains forward slashes, URL-encode each `/` as `%2F`. The tag is matched exactly as encoded, including leading, trailing, and consecutive slashes, which are preserved and not collapsed (for example, the tag `/services/payments-api` is referenced as `%2Fservices%2Fpayments-api`). Tags containing slashes are supported via the API but not in the Cortex UI; this difference is expected.
        in: path
        name: tagOrId
        required: true
        schema:
          type: string
          description: Entity identifier - can be a tag or CID
      responses:
        '200':
          content:
            application/json:
              schema:
                oneOf:
                - type: string
                - $ref: '#/components/schemas/JsonNode'
          description: Successfully found entity descriptor
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Entity not found
        '429':
          $ref: '#/components/responses/TooManyRequests'
      summary: Retrieve entity descriptor
      tags:
      - Catalog Entities
      x-cortex-mcp-description: Retrieve an entity's Cortex descriptor - the x-cortex-* configuration the entity is defined by. Returns JSON by default; pass yaml=true for the YAML form. Distinct from getOpenApiDocForEntity, which returns the API the service exposes.
      x-cortex-mcp-enabled: 'true'
  /api/v1/catalog/{tagOrId}/scorecards:
    get:
      operationId: listScorecardScoresForEntity
      parameters:
      - description: The tag (`x-cortex-tag`) or unique, auto-generated identifier (CID) for the entity. If the tag contains forward slashes, URL-encode each `/` as `%2F`. The tag is matched exactly as encoded, including leading, trailing, and consecutive slashes, which are preserved and not collapsed (for example, the tag `/services/payments-api` is referenced as `%2Fservices%2Fpayments-api`). Tags containing slashes are supported via the API but not in the Cortex UI; this difference is expected.
        in: path
        name: tagOrId
        required: true
        schema:
          type: string
          description: Entity identifier - can be a tag or CID
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ScorecardScore'
          description: All entity Scorecard scores
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Entity not found
        '429':
          $ref: '#/components/responses/TooManyRequests'
      summary: Retrieve entity Scorecard scores
      tags:
      - Catalog Entities
      x-cortex-mcp-description: List every scorecard that evaluates one entity, with that entity's score and rule outcomes on each. This is the per-entity view; use listScorecardScores to read one scorecard across many entities.
      x-cortex-mcp-enabled: 'true'
  /api/v1/catalog/{tagOrId}/unarchive:
    put:
      operationId: unarchiveEntity
      parameters:
      - description: The tag (`x-cortex-tag`) or unique, auto-generated identifier (CID) for the entity. If the tag contains forward slashes, URL-encode each `/` as `%2F`. The tag is matched exactly as encoded, including leading, trailing, and consecutive slashes, which are preserved and not collapsed (for example, the tag `/services/payments-api` is referenced as `%2Fservices%2Fpayments-api`). Tags containing slashes are supported via the API but not in the Cortex UI; this difference is expected.
        in: path
        name: tagOrId
        required: true
        schema:
          type: string
          description: Entity identifier - can be a tag or CID
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailsResponse'
          description: Successfully unarchived entity
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Entity not found
        '429':
          $ref: '#/components/responses/TooManyRequests'
      summary: Unarchive an entity
      tags:
      - Catalog Entities
      x-cortex-mcp-description: Restore an archived entity by tag or CID so it shows in the catalog again. Unarchiving an entity that is not archived changes nothing. Returns the entity's full details, and 404 if the entity is not found.
      x-cortex-mcp-enabled: 'true'
  /api/v1/catalog/{tagOrId}/verifications:
    get:
      description: Returns one entry per verification period the entity is in scope for, including periods the entity has not been verified for yet.
      operationId: listVerificationsForEntity
      parameters:
      - description: The tag (`x-cortex-tag`) or unique, auto-generated identifier (CID) for the entity. If the tag contains forward slashes, URL-encode each `/` as `%2F`. The tag is matched exactly as encoded, including leading, trailing, and consecutive slashes, which are preserved and not collapsed (for example, the tag `/services/payments-api` is referenced as `%2Fservices%2Fpayments-api`). Tags containing slashes are supported via the API but not in the Cortex UI; this difference is expected.
        in: path
        name: tagOrId
        required: true
        schema:
          type: string
          description: Entity identifier - can be a tag or CID
      - description: Number of results to return per page, between 1 and 1000. Default 250.
        in: query
        name: pageSize
        required: true
        schema:
          type: integer
          format: int32
          default: 250
      - description: Page number to return, 0-indexed. Default 0.
        in: query
        name: page
        required: true
        schema:
          type: integer
          format: int32
          default: 0
      - description: Return only verifications whose period is open today (true) or only those whose period is not (false). Omit for all periods.
        example: true
        in: query
        name: isActive
        required: false
        schema:
          type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListEntityVerifications'
          description: All verifications for the entity
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Entity not found
        '429':
          $ref: '#/components/responses/TooManyRequests'
      summary: Retrieve entity verifications
      tags:
      - Catalog Entities
      x-cortex-mcp-description: List the verifications for a single entity, one entry per verification period the entity is in scope for, including periods it has not been verified for yet. Use this to check whether one service, resource, or domain is up to date on its verifications.
      x-cortex-mcp-enabled: 'true'
  /api/v1/catalog/{tagOrId}/verifications/{periodCid}:
    put:
      description: Records the caller's answer for one entity in one verification period. The period must be open, and the caller must own the entity -- unless it is a global API key granted the "Verify any entity" permission, for which ownership is waived.
      operationId: verifyEntityForPeriod
      parameters:
      - description: The tag (`x-cortex-tag`) or unique, auto-generated identifier (CID) for the entity. If the tag contains forward slashes, URL-encode each `/` as `%2F`. The tag is matched exactly as encoded, including leading, trailing, and consecutive slashes, which are preserved and not collapsed (for example, the tag `/services/payments-api` is referenced as `%2Fservices%2Fpayments-api`). Tags containing slashes are supported via the API but not in the Cortex UI; this difference is expected.
        in: path
        name: tagOrId
        required: true
        schema:
          type: string
          description: Entity identifier - can be a tag or CID
      - description: The CID of the verification period
        example: vp0a1b2c3d4e5f6789
        in: path
        name: periodCid
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEntityRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityVerification'
          description: The recorded verification
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The period is not currently open, the status is PENDING, or a reason is required and missing
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The caller does not own the entity, lacks a role the period requires, or authenticated with a key that has no user
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: No such entity or period, or the entity is not in the period's scope
        '429':
          $ref: '#/components/responses/TooManyRequests'
      summary: Verify an entity for a verification period
      tags:
      - Catalog Entities
      x-cortex-mcp-description: Record the caller's verification answer for one entity in one verification period (by entity tag or ID and periodCid). status is VERIFIED_CORRECT or VERIFIED_INCORRECT; PENDING is rejected. A reason is required for VERIFIED_INCORRECT when the period sets reasonRequired. The period must be open, and the caller must own the entity and hold any roles the period requires. Use listVerificationPeriods to find the periodCid.
      x-cortex-mcp-enabled: 'true'
  /api/v1/open-api:
    patch:
      description: Creates or updates an entity using OpenAPI. If the YAML refers to an entity that already exists (as referenced by the `x-cortex-tag`), this API will merge the specified changes into the existing entity.
      operationId: createOrPatchEntity
      parameters:
      - description: When true, this endpoint only validates the descriptor contents and returns any errors or warnings.
        in: query
        name: dryRun
        required: false
        schema:
          type: boolean
      - description: 'Delete keys with this value from the merged yaml, e.g. `__delete__`, if any values match this, they will not be included in merged YAML. For example `my_value: __delete__` will remove `my_value` from the merged YAML.'
        in: query
        name: deleteMarkerValue
        required: false
        schema:
          type: string
      - description: Default merge behavior is to replace arrays, set this to true to append arrays instead. For simple types, duplicate values will be removed from the merged array.
        in: query
        name: appendArrays
        required: false
        schema:
          type: boolean
      - description: Default behavior is to upsert the entity, set `failIfEntityDoesNotExist=true` to fail (404) if the entity specified in `x-cortex-tag` does not exist.
        in: query
        name: failIfEntityDoesNotExist
        required: false
        schema:
          type: boolean
      - description: Maximum time (milliseconds) to wait for asynchronous property updates. Default is zero.
        in: query
        name: asyncUpdateWaitTimeMs
        required: false
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/openapi;charset=UTF-8:
            schema:
              type: string
        description: "Raw text of the YAML  \n See examples of cortex.yaml files for each entity type [here](https://docs.cortex.io/docs/reference/basics/entities#example-cortexyaml-for-service-entity)"
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenApiResponse'
          description: Indicates that the entity body was accepted, and the referenced `x-cortex-tag` existed and patched successfully
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenApiResponse'
          description: Indicates that the entity body was accepted, and the referenced `x-cortex-tag` did not exist and was created successfully
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenApiResponse'
          description: Invalid YAML (major errors or incorrectly formatted YAML)
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenApiResponse'
          description: Specified entity does not exist (when failIfDoesNotExist is set to true)
        '429':
          $ref: '#/components/responses/TooManyRequests'
      summary: Create or patch entity
      tags:
      - Catalog Entities
      x-cortex-mcp-description: Merge a partial YAML descriptor (tag at info.x-cortex-tag) into an existing entity. Keys you leave out are kept. If no entity has that tag, it is created, unless failIfEntityDoesNotExist=true, which returns 404 instead. Arrays are replaced by default; pass appendArrays=true to add to them. To remove a key, set its value to the string given in deleteMarkerValue (e.g. `__delete__`). Pass dryRun=true to only validate. Use createOrUpdateEntity to replace the whole descriptor.
      x-cortex-mcp-enabled: 'true'
    post:
      description: Create a catalog entity using a descriptor YAML. By default (UPSERT mode), if the entity already exists (as referenced by the `x-cortex-tag`), this API will update the existing entity. In CREATE mode, the API will fail if the entity already exists.
      operationId: createOrUpdateEntity
      parameters:
      - description: When true, this endpoint only validates the descriptor contents and returns any errors or warnings.
        in: query
        name: dryRun
        required: false
        schema:
          type: boolean
      - description: Add a comment with validation errors on the pull request with the given ID
        in: query
        name: githubPullRequest
        required: false
        schema:
          type: integer
          format: int32
      - description: 'Mode of operation: UPSERT (default) creates or updates existing entity, CREATE fails if entity already exists.'
        in: query
        name: mode
        required: false
        schema:
          type: string
          enum:
          - UPSERT
          - CREATE
      - description: Maximum time (milliseconds) to wait for asynchronous property updates. Default is zero.
        in: query
        name: asyncUpdateWaitTimeMs
        required: false
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/openapi;charset=UTF-8:
            schema:
              type: string
        description: "Raw text of the YAML  \n See examples of cortex.yaml files for each entity type [here](https://docs.cortex.io/docs/reference/basics/entities#example-cortexyaml-for-service-entity)"
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenApiResponse'
          description: Indicates that the entity was accepted and processed successfully
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenApiResponse'
          description: Invalid YAML (major errors or incorrectly formatted YAML)
        '429':
          $ref: '#/components/responses/TooManyRequests'
      summary: Create or update entity
      tags:
      - Catalog Entities
      x-cortex-mcp-description: Create a catalog entity from a full YAML descriptor (OpenAPI-style, with the tag at info.x-cortex-tag), or update the entity that already has that tag. An update replaces the whole descriptor, so any key you leave out is removed. To change only some fields, use createOrPatchEntity. Pass mode=CREATE to fail instead of overwriting an existing entity. Pass dryRun=true to only validate the descriptor and see its errors and warnings.
      x-cortex-mcp-enabled: 'true'
components:
  schemas:
    EntityCIDListResponse:
      required:
      - ids
      - page
      - total
      - totalPages
      type: object
      properties:
        ids:
          type: array
          description: Unique, immutable, 18-character auto-generated identifier for the entity.
          example: en2da8159dbeefb974
          items:
            type: string
            description: Unique, immutable, 18-character auto-generated identifier for the entity.
            example: en2da8159dbeefb974
        page:
          type: integer
          format: int32
        total:
          type: integer
          format: int32
        totalPages:
          type: integer
          format: int32
    SearchResultEntity:
      required:
      - cid
      - groups
      - name
      - ownerEmails
      - owningTeamTags
      - status
      - tag
      - type
      type: object
      properties:
        cid:
          type: string
          description: Stable 18-char identifier (hashid)
          example: en2da8159dbeefb974
        description:
          type: string
        groups:
          type: array
          description: Free-form tags used to organize the catalog — inclusion or exclusion criteria in Scorecards, catalogs, and CQL reports. Corresponds to the x-cortex-groups field in the Catalog Descriptor.
          items:
            type: string
            description: Free-form tags used to organize the catalog — inclusion or exclusion criteria in Scorecards, catalogs, and CQL reports. Corresponds to the x-cortex-groups field in the Catalog Descriptor.
        name:
          type: string
        ownerEmails:
          type: array
          description: Emails of individual owners
          items:
            type: string
            description: Emails of individual owners
        owningTeamTags:
          type: array
          description: Tags of the teams that own this entity
          items:
            type: string
            description: Tags of the teams that own this entity
        status:
          type: string
          enum:
          - ACTIVE
          - ARCHIVED
        tag:
          type: string
          description: Human slug / x-cortex-tag
          example: payments-api
        type:
          type: string
          description: Entity type
          example: service
      description: A single search result, lean by design.
    CurrentLevel:
      required:
      - name
      - number
      type: object
      properties:
        name:
          type: string
          description: Name of the level
          example: Bronze
        number:
          type: integer
          description: Rank of the level where 1 is the highest
          format: int32
    Role:
      required:
      - name
      type: object
      properties:
        name:
          type: string
          description: Name of the role
          example: Team Leader
        source:
          type: string
          description: Source of the role if pulled in through integration. This will be blank if manually defined in Cortex.
          example: WORKDAY
    Link:
      required:
      - name
      - type
      - url
      type: object
      properties:
        description:
          type: string
          description: An optional description of the link
        name:
          type: string
          description: Human-readable name for the link visible in the Catalog
        type:
          type: string
          description: Corresponds to the type field in a link definition provided in the Catalog Descriptor
        url:
          type: string
      description: Relevant links for the entity. Corresponds to the x-cortex-links field in the entity descriptor
    Owners:
      required:
      - emails
      - groups
      - slackChannels
      type: object
      properties:
        emails:
          type: array
          items:
            $ref: '#/components/schemas/Email'
        groups:
          type: array
          description: List of IdP or Cortex Teams (not to be confused with the x-cortex-groups).
          items:
            $ref: '#/components/schemas/OwnerGroup'
        slackChannels:
          type: array
          description: Use the top-level `slackChannels` field instead of the one nested inside `ownership`
          deprecated: true
          items:
            $ref: '#/components/schemas/SlackChannel'
    VerificationPeriod:
      required:
      - cid
      - endDate
      - isActive
      - name
      - startDate
      type: object
      properties:
        cid:
          type: string
          description: Stable identifier for the period
          example: vp0a1b2c3d4e5f6789
        description:
          type: string
          description: What owners are being asked to confirm
        endDate:
          type: string
          description: When the period closes
          format: date-time
        isActive:
          type: boolean
          description: Whether the period is open today, and so still accepting verifications
          example: true
        name:
          type: string
          description: Display name
          example: Q3 Ownership Review
        startDate:
          type: string
          description: When the period opens
          format: date-time
