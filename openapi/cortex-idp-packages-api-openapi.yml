      tags:
      - Packages
      x-cortex-mcp-description: 'Upload a pnpm-lock.yaml for an entity (body: raw YAML text; lockfile version 6 or higher). REPLACES all of the entity''s Node packages, including those from package.json, package-lock.json or yarn.lock uploads, with the resolved versions.'
