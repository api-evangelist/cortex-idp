        in: path
        name: tagOrId
        required: true
        schema:
          type: string
          description: Entity identifier - can be a tag or CID
      requestBody:
        content:
          application/xml:
            schema:
              type: string
        description: Stringified version of your packages.config file
        required: true
      responses:
        '200':
          content:
            application/json:
              example:
              - dateCreated: '2023-01-01T01:01:01.000Z'
                id: 0
                name: string
                packageType: NUGET
                version: string
              schema:
                type: array
                items:
