openapi: 3.2.0
info:
  description: The Cortex REST API provides programmatic access to the data in the catalog, Scorecards, and more.
  title: Cortex Packages API
  version: v1
servers:
- url: https://api.getcortexapp.com
  description: Cortex Cloud API host
security:
- bearerAuth: []
tags:
- name: Packages
paths:
  /api/v1/catalog/{tagOrId}/packages:
    get:
      operationId: listPackages
      parameters:
      - description: The tag (`x-cortex-tag`) or unique, auto-generated identifier (CID) for the entity. If the tag contains forward slashes, URL-encode each `/` as `%2F`. The tag is matched exactly as encoded, including leading, trailing, and consecutive slashes, which are preserved and not collapsed (for example, the tag `/services/payments-api` is referenced as `%2Fservices%2Fpayments-api`). Tags containing slashes are supported via the API but not in the Cortex UI; this difference is expected.
        in: path
        name: tagOrId
        required: true
        schema:
          type: string
          description: Entity identifier - can be a tag or CID
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Package'
          description: All packages. If using pagination, we do not return page, total, or totalPages in the response. An empty array is returned once you reach the end.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Entity not found
        '429':
          $ref: '#/components/responses/TooManyRequests'
      summary: List packages
      tags:
      - Packages
      x-cortex-mcp-enabled: 'false'
  /api/v1/catalog/{tagOrId}/packages/dotnet/nuget:
    delete:
      operationId: deleteNugetPackage
      parameters:
      - description: The tag (`x-cortex-tag`) or unique, auto-generated identifier (CID) for the entity. If the tag contains forward slashes, URL-encode each `/` as `%2F`. The tag is matched exactly as encoded, including leading, trailing, and consecutive slashes, which are preserved and not collapsed (for example, the tag `/services/payments-api` is referenced as `%2Fservices%2Fpayments-api`). Tags containing slashes are supported via the API but not in the Cortex UI; this difference is expected.
        in: path
        name: tagOrId
        required: true
        schema:
          type: string
          description: Entity identifier - can be a tag or CID
      - in: query
        name: name
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successfully deleted package
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Entity not found
        '429':
          $ref: '#/components/responses/TooManyRequests'
      summary: '[csharp] Delete Nuget package'
      tags:
      - Packages
      x-cortex-mcp-enabled: 'false'
  /api/v1/catalog/{tagOrId}/packages/dotnet/nuget/csproj:
    post:
      operationId: uploadNugetCsproj
      parameters:
      - description: The tag (`x-cortex-tag`) or unique, auto-generated identifier (CID) for the entity. If the tag contains forward slashes, URL-encode each `/` as `%2F`. The tag is matched exactly as encoded, including leading, trailing, and consecutive slashes, which are preserved and not collapsed (for example, the tag `/services/payments-api` is referenced as `%2Fservices%2Fpayments-api`). Tags containing slashes are supported via the API but not in the Cortex UI; this difference is expected.
        in: path
        name: tagOrId
        required: true
        schema:
          type: string
          description: Entity identifier - can be a tag or CID
      requestBody:
        content:
          application/xml:
            schema:
              type: string
        description: Stringified version of your *.csproj file
        required: true
      responses:
        '200':
          content:
            application/json:
              example:
              - dateCreated: '2023-01-01T01:01:01.000Z'
                id: 0
                name: string
                packageType: NUGET
                version: string
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Package'
          description: Successfully saved packages
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unsupported csproj format, e.g. a .NET Framework project that declares dependencies with <Reference> elements
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Entity not found
        '429':
          $ref: '#/components/responses/TooManyRequests'
      summary: '[csharp] Upload Nuget csproj'
      tags:
      - Packages
      x-cortex-mcp-description: 'Upload a .NET *.csproj for an entity (body: raw XML text). Reads `<PackageReference>` elements and REPLACES all of the entity''s NuGet packages, including those from packages.config or packages.lock.json uploads. Fails with 400 for .NET Framework projects that use only `<Reference>`; use uploadNugetPackagesConfig for those.'
      x-cortex-mcp-enabled: 'true'
