      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PackageVersionRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              example:
                dateCreated: '2023-01-01T01:01:01.000Z'
                id: 0
                name: string
                packageType: JAVA
                version: string
              schema:
                $ref: '#/components/schemas/Package'
          description: Successfully saved package
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Entity not found
        '429':
          $ref: '#/components/responses/TooManyRequests'
      summary: '[java] Upload single Java package'
      tags:
      - Packages
      x-cortex-mcp-description: 'Add or update a single Java package on an entity (JSON body: `{name, version}`, e.g. `com.google.guava:guava`). Upserts by name: it overwrites any existing Java package with that name, including one parsed from a pom.xml, and leaves all other packages alone. To sync a whole pom.xml, use uploadMavenPom.'
      x-cortex-mcp-enabled: 'true'
  /api/v1/catalog/{tagOrId}/packages/java/bulk:
    post:
      operationId: uploadJavaPackages
      parameters:
      - description: The tag (`x-cortex-tag`) or unique, auto-generated identifier (CID) for the entity. If the tag contains forward slashes, URL-encode each `/` as `%2F`. The tag is matched exactly as encoded, including leading, trailing, and consecutive slashes, which are preserved and not collapsed (for example, the tag `/services/payments-api` is referenced as `%2Fservices%2Fpayments-api`). Tags containing slashes are supported via the API but not in the Cortex UI; this difference is expected.
