                version: string
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Package'
          description: Successfully saved packages
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Entity not found
        '429':
          $ref: '#/components/responses/TooManyRequests'
      summary: '[csharp] Upload Nuget packages.lock.json'
      tags:
      - Packages
      x-cortex-mcp-description: 'Upload a NuGet packages.lock.json for an entity (body: raw JSON text). Reads the resolved versions of the first target framework and REPLACES all of the entity''s NuGet packages, including those from csproj or packages.config uploads.'
      x-cortex-mcp-enabled: 'true'
  /api/v1/catalog/{tagOrId}/packages/go:
