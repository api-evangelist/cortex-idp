          description: Entity not found
        '429':
          $ref: '#/components/responses/TooManyRequests'
      summary: '[golang] Upload go.sum'
      tags:
      - Packages
      x-cortex-mcp-description: 'Upload a Go go.sum for an entity (body: raw file text). Keeps the highest version of each module and REPLACES all of the entity''s Go packages.'
      x-cortex-mcp-enabled: 'true'
