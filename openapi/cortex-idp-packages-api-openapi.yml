      summary: '[js] Upload NPM/Yarn/PNPM package.json'
      tags:
      - Packages
      x-cortex-mcp-description: 'Upload a package.json for an entity (body: raw file text). Parses only `dependencies` (not devDependencies) and REPLACES all of the entity''s Node packages, including those from package-lock.json, yarn.lock or pnpm-lock.yaml uploads. Prefer a lockfile tool (uploadNpmPackageLockJson, uploadYarnLock, uploadPnpmLock) for resolved versions.'
