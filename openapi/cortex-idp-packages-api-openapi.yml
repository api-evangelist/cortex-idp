          description: Successfully saved packages
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Entity not found
        '429':
          $ref: '#/components/responses/TooManyRequests'
      summary: '[csharp] Upload Nuget packages.config'
      tags:
      - Packages
      x-cortex-mcp-description: 'Upload a .NET packages.config for an entity (body: raw XML text; the format older .NET Framework projects use). REPLACES all of the entity''s NuGet packages, including those from csproj or packages.lock.json uploads.'
      x-cortex-mcp-enabled: 'true'
