      tags:
      - Packages
      x-cortex-mcp-description: 'Upload a Maven pom.xml for an entity (body: raw XML text). REPLACES the Java packages that came from earlier pom uploads but keeps packages added one at a time with uploadJavaPackage.'
      x-cortex-mcp-enabled: 'true'
