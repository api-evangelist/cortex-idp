openapi: 3.2.0
info:
  description: The Cortex REST API provides programmatic access to the data in the catalog, Scorecards, and more.
  title: Cortex [Integrations] Bitbucket API
  version: v1
servers:
- url: https://api.getcortexapp.com
  description: Cortex Cloud API host
security:
- bearerAuth: []
tags:
- name: '[Integrations] Bitbucket'
paths:
  /api/v1/bitbucket/configuration:
    post:
      operationId: BitbucketSaveConfiguration
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - $ref: '#/components/schemas/BitbucketCloudAtlassianRequest'
              - $ref: '#/components/schemas/BitbucketCloudPersonalRequest'
              - $ref: '#/components/schemas/BitbucketOnPremBasicRequest'
              - $ref: '#/components/schemas/BitbucketWorkspaceTokenRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigurationsResponseBitbucketConfigurationResponse'
          description: Successfully added configuration
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden
        '429':
          $ref: '#/components/responses/TooManyRequests'
      summary: Add a single configuration
      tags:
      - '[Integrations] Bitbucket'
      x-cortex-mcp-enabled: 'false'
  /api/v1/bitbucket/configuration/validate:
    post:
      operationId: BitbucketValidateAllConfigurations
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MultipleIntegrationConfigValidation'
          description: Successfully validated all configurations
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Configuration not found
        '429':
          $ref: '#/components/responses/TooManyRequests'
      summary: Validate all configurations
      tags:
      - '[Integrations] Bitbucket'
      x-cortex-mcp-enabled: 'false'
  /api/v1/bitbucket/configuration/validate/{alias}:
    post:
      operationId: BitbucketValidateConfiguration
      parameters:
      - in: path
        name: alias
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationConfigValidation'
          description: Successfully validated configuration
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Configuration not found
        '429':
          $ref: '#/components/responses/TooManyRequests'
      summary: Validate a configuration
      tags:
      - '[Integrations] Bitbucket'
      x-cortex-mcp-enabled: 'false'
  /api/v1/bitbucket/configuration/{alias}:
    delete:
      operationId: BitbucketRemoveConfiguration
      parameters:
      - in: path
        name: alias
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigurationsResponseBitbucketConfigurationResponse'
          description: Successfully deleted configuration
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Configuration not found
        '429':
          $ref: '#/components/responses/TooManyRequests'
      summary: Delete a configuration
      tags:
      - '[Integrations] Bitbucket'
      x-cortex-mcp-enabled: 'false'
    get:
      operationId: BitbucketGetConfiguration
      parameters:
      - in: path
        name: alias
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitbucketConfigurationResponse'
          description: Successfully found configuration
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Configuration not found
        '429':
          $ref: '#/components/responses/TooManyRequests'
      summary: Retrieve a configuration
      tags:
      - '[Integrations] Bitbucket'
      x-cortex-mcp-enabled: 'false'
    put:
      description: 'WARNING: Updating aliases for configurations or changing the default configuration could cause entity YAMLs that use this integration to break.'
      operationId: BitbucketUpdateConfiguration
      parameters:
      - in: path
        name: alias
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - $ref: '#/components/schemas/BitbucketUpdateCloudAtlassianRequest'
              - $ref: '#/components/schemas/BitbucketUpdateCloudPersonalRequest'
              - $ref: '#/components/schemas/BitbucketUpdateOnPremBasicRequest'
              - $ref: '#/components/schemas/BitbucketUpdateWorkspaceTokenRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigurationsResponseBitbucketConfigurationResponse'
          description: Successfully updated configuration
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Configuration not found
        '429':
          $ref: '#/components/responses/TooManyRequests'
      summary: Update a configuration
      tags:
      - '[Integrations] Bitbucket'
      x-cortex-mcp-enabled: 'false'
  /api/v1/bitbucket/configurations:
    delete:
      operationId: BitbucketRemoveAllConfigurations
      responses:
        '200':
          description: Successfully deleted all configurations
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden
        '429':
          $ref: '#/components/responses/TooManyRequests'
      summary: Delete all configurations
      tags:
      - '[Integrations] Bitbucket'
      x-cortex-mcp-enabled: 'false'
    get:
      operationId: BitbucketListConfigurations
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigurationsResponseBitbucketConfigurationResponse'
          description: Successfully found configurations
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        '429':
          $ref: '#/components/responses/TooManyRequests'
      summary: Retrieve configurations
      tags:
      - '[Integrations] Bitbucket'
      x-cortex-mcp-enabled: 'false'
    post:
      operationId: BitbucketSaveConfigurations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigurationsRequestBitbucketConfigurationRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MultipleConfigurationsResponseBitbucketConfigurationResponse'
          description: Successfully added configurations
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden
        '429':
          $ref: '#/components/responses/TooManyRequests'
      summary: Add multiple configurations
      tags:
      - '[Integrations] Bitbucket'
      x-cortex-mcp-enabled: 'false'
  /api/v1/bitbucket/default-configuration:
    get:
      operationId: BitbucketGetDefaultConfiguration
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitbucketConfigurationResponse'
          description: Successfully found default configuration
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        '429':
          $ref: '#/components/responses/TooManyRequests'
      summary: Retrieve default configuration
      tags:
      - '[Integrations] Bitbucket'
      x-cortex-mcp-enabled: 'false'
components:
  schemas:
    BitbucketOnPremBasicRequest:
      type: object
      allOf:
      - $ref: '#/components/schemas/BitbucketConfigurationRequest'
      - required:
        - host
        - password
        - username
        type: object
        properties:
          host:
            type: string
          password:
            type: string
          username:
            type: string
    MultipleConfigurationsResponseBitbucketConfigurationResponse:
      required:
      - configurations
      - skippedConfigurations
      type: object
      properties:
        configurations:
          type: array
          items:
            $ref: '#/components/schemas/BitbucketConfigurationResponse'
        skippedConfigurations:
          type: object
          additionalProperties:
            type: string
    BitbucketConfigurationResponse:
      required:
      - alias
      - isDefault
      - type
      type: object
      properties:
        alias:
          type: string
        host:
          type: string
        isDefault:
          type: boolean
        lastFour:
          type: string
        type:
          type: string
        username:
          type: string
        workspace:
          type: string
    BitbucketUpdateCloudAtlassianRequest:
      type: object
      allOf:
      - $ref: '#/components/schemas/BitbucketUpdateConfigurationRequest'
      - type: object
        properties:
          clientKey:
            type: string
    BitbucketConfigurationRequest:
      required:
      - alias
      - isDefault
      - type
      type: object
      properties:
        alias:
          type: string
        isDefault:
          type: boolean
        type:
          type: string
      discriminator:
        propertyName: type
    IntegrationConfigValidation:
      required:
      - isValid
      type: object
      properties:
        alias:
          type: string
        isValid:
          type: boolean
        message:
          type: string
    ErrorResponse:
      required:
      - message
      - type
      type: object
      properties:
        details:
          type: string
        errorCode:
          type: string
        gatewayHttpStatus:
          type: integer
          format: int32
        httpStatus:
          type: integer
          format: int32
        message:
          type: string
        requestId:
          type: string
        type:
          type: string
          enum:
          - INTEGRATION_MISSING
          - INTEGRATION_UNREGISTERED
          - INTEGRATION_UNSUPPORTED
          - INTEGRATION_GRAPHQL_ERROR
          - INTEGRATION_BAD_REQUEST
          - INTEGRATION_UNAUTHORIZED
          - INTEGRATION_FORBIDDEN
          - INTEGRATION_NOT_FOUND
          - INTEGRATION_UNPROCESSABLE_CONTENT
          - INTEGRATION_RATE_LIMITED
          - INTEGRATION_INTERNAL_ERROR
          - INTEGRATION_NOT_IMPLEMENTED
          - INTEGRATION_BAD_GATEWAY
          - INTEGRATION_UNAVAILABLE
          - INTEGRATION_GATEWAY_TIMEOUT
          - INTEGRATION_TIMED_OUT
          - INTEGRATION_CACHE_ERROR
          - INTEGRATION_UNHANDLED_HTTP_ERROR
          - INTEGRATION_UNHANDLED_EXCEPTION
          - INTEGRATION_UNEXPECTED_ERROR
          - ILLEGAL_ARGUMENT_ERROR
          - BAD_REQUEST
          - FORBIDDEN
          - NOT_FOUND
          - REQUEST_TIMEOUT
          - CONFLICT
          - UNHANDLED_EXCEPTION
          - UNCATEGORIZED
          - SERVICE_CREATOR
          - UNKNOWN_HOST
          - TOO_MANY_REQUESTS
    ConfigurationsRequestBitbucketConfigurationRequest:
      required:
      - configurations
      type: object
      properties:
        configurations:
          type: array
          items:
            oneOf:
            - $ref: '#/components/schemas/BitbucketCloudAtlassianRequest'
            - $ref: '#/components/schemas/BitbucketCloudPersonalRequest'
            - $ref: '#/components/schemas/BitbucketOnPremBasicRequest'
            - $ref: '#/components/schemas/BitbucketWorkspaceTokenRequest'
    BitbucketCloudPersonalRequest:
      type: object
      allOf:
      - $ref: '#/components/schemas/BitbucketConfigurationRequest'
      - required:
        - password
        - username
        type: object
        properties:
          password:
            type: string
          username:
            type: string
          workspace:
            type: string
    BitbucketCloudAtlassianRequest:
      type: object
      allOf:
      - $ref: '#/components/schemas/BitbucketConfigurationRequest'
      - type: object
        properties:
          clientKey:
            type: string
          workspace:
            type: string
    BitbucketUpdateOnPremBasicRequest:
      type: object
      allOf:
      - $ref: '#/components/schemas/BitbucketUpdateConfigurationRequest'
      - type: object
        properties:
          host:
            type: string
    ConfigurationsResponseBitbucketConfigurationResponse:
      required:
      - configurations
      type: object
      properties:
        configurations:
          type: array
          items:
            $ref: '#/components/schemas/BitbucketConfigurationResponse'
    BitbucketWorkspaceTokenRequest:
      type: object
      allOf:
      - $ref: '#/components/schemas/BitbucketConfigurationRequest'
      - required:
        - token
        type: object
        properties:
          token:
            type: string
          workspace:
            type: string
    BitbucketUpdateConfigurationRequest:
      required:
      - alias
      - isDefault
      - type
      type: object
      properties:
        alias:
          type: string
        isDefault:
          type: boolean
        password:
          type: string
        token:
          type: string
        type:
          type: string
        username:
          type: string
        workspace:
          type: string
      discriminator:
        propertyName: type
    BitbucketUpdateWorkspaceTokenRequest:
      type: object
      allOf:
      - $ref: '#/components/schemas/BitbucketUpdateConfigurationRequest'
    BitbucketUpdateCloudPersonalRequest:
      type: object
      allOf:
      - $ref: '#/components/schemas/BitbucketUpdateConfigurationRequest'
    MultipleIntegrationConfigValidation:
      required:
      - configurations
      type: object
      properties:
        configurations:
          type: array
          items:
            $ref: '#/components/schemas/IntegrationConfigValidation'
    TooManyRequestsProblemDetail:
      required:
      - type
      - title
      - status
      type: object
      properties:
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        retryAfter:
          minimum: 0
          type: integer
          description: The number of seconds until the rate limiting resets.
          format: int32
        status:
          maximum: 599
          minimum: 100
          type: integer
          format: int32
          enum:
          - 429
        title:
          type: string
        type:
          type: string
          format: uri-reference
  responses:
    TooManyRequests:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/TooManyRequestsProblemDetail'
      description: The client has exceeded the rate limit by performing too many requests in a short period. Retry the request after a delay.
      headers:
        Retry-After:
          description: The number of seconds until the rate limiting resets.
          schema:
            minimum: 0
            type: integer
            format: int32
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      description: 'All requests to the Cortex API need to provide an `Authorization: Bearer <token>` header, where `<token>` is an API key created in the Settings page of your workspace.'
      scheme: bearer
      type: http
x-provenance:
  method: harvested
  publisher: Cortex
  source: https://docs.cortex.io/openapi/cortex_swagger.json
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
    stamped by stamp-openapi-provenance.py (roadmap#793)
