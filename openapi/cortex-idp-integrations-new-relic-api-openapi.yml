openapi: 3.2.0
info:
  description: The Cortex REST API provides programmatic access to the data in the catalog, Scorecards, and more.
  title: Cortex [Integrations] New Relic API
  version: v1
servers:
- url: https://api.getcortexapp.com
  description: Cortex Cloud API host
security:
- bearerAuth: []
tags:
- name: '[Integrations] New Relic'
paths:
  /api/v1/newrelic/configuration:
    post:
      operationId: NewRelicSaveConfiguration
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewrelicConfigurationRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigurationsResponseNewrelicConfiguration'
          description: Successfully added configuration
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden
        '429':
          $ref: '#/components/responses/TooManyRequests'
      summary: Add a single configuration
      tags:
      - '[Integrations] New Relic'
      x-cortex-mcp-enabled: 'false'
  /api/v1/newrelic/configuration/validate:
    post:
      operationId: NewRelicValidateAllConfigurations
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MultipleIntegrationConfigValidation'
          description: Successfully validated all configurations
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Configuration not found
        '429':
          $ref: '#/components/responses/TooManyRequests'
      summary: Validate all configurations
      tags:
      - '[Integrations] New Relic'
      x-cortex-mcp-enabled: 'false'
  /api/v1/newrelic/configuration/validate/{alias}:
    post:
      operationId: NewRelicValidateConfiguration
      parameters:
      - in: path
        name: alias
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationConfigValidation'
          description: Successfully validated configuration
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Configuration not found
        '429':
          $ref: '#/components/responses/TooManyRequests'
      summary: Validate a configuration
      tags:
      - '[Integrations] New Relic'
      x-cortex-mcp-enabled: 'false'
  /api/v1/newrelic/configuration/{alias}:
    delete:
      operationId: NewRelicRemoveConfiguration
      parameters:
      - in: path
        name: alias
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigurationsResponseNewrelicConfiguration'
          description: Successfully deleted configuration
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Configuration not found
        '429':
          $ref: '#/components/responses/TooManyRequests'
      summary: Delete a configuration
      tags:
      - '[Integrations] New Relic'
      x-cortex-mcp-enabled: 'false'
    get:
      operationId: NewRelicGetConfiguration
      parameters:
      - in: path
        name: alias
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewrelicConfiguration'
          description: Successfully found configuration
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Configuration not found
        '429':
          $ref: '#/components/responses/TooManyRequests'
      summary: Retrieve a configuration
      tags:
      - '[Integrations] New Relic'
      x-cortex-mcp-enabled: 'false'
    put:
      description: 'WARNING: Updating aliases for configurations or changing the default configuration could cause entity YAMLs that use this integration to break.'
      operationId: NewRelicUpdateConfiguration
      parameters:
      - in: path
        name: alias
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewrelicUpdateConfigurationRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigurationsResponseNewrelicConfiguration'
          description: Successfully updated configuration
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Configuration not found
        '429':
          $ref: '#/components/responses/TooManyRequests'
      summary: Update a configuration
      tags:
      - '[Integrations] New Relic'
      x-cortex-mcp-enabled: 'false'
  /api/v1/newrelic/configurations:
    delete:
      operationId: NewRelicRemoveAllConfigurations
      responses:
        '200':
          description: Successfully deleted all configurations
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden
        '429':
          $ref: '#/components/responses/TooManyRequests'
      summary: Delete all configurations
      tags:
      - '[Integrations] New Relic'
      x-cortex-mcp-enabled: 'false'
    get:
      operationId: NewRelicListConfigurations
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigurationsResponseNewrelicConfiguration'
          description: Successfully found configurations
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        '429':
          $ref: '#/components/responses/TooManyRequests'
      summary: Retrieve configurations
      tags:
      - '[Integrations] New Relic'
      x-cortex-mcp-enabled: 'false'
    post:
      operationId: NewRelicSaveConfigurations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigurationsRequestNewrelicConfigurationRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MultipleConfigurationsResponseNewrelicConfiguration'
          description: Successfully added configurations
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden
        '429':
          $ref: '#/components/responses/TooManyRequests'
      summary: Add multiple configurations
      tags:
      - '[Integrations] New Relic'
      x-cortex-mcp-enabled: 'false'
  /api/v1/newrelic/default-configuration:
    get:
      operationId: NewRelicGetDefaultConfiguration
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewrelicConfiguration'
          description: Successfully found default configuration
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        '429':
          $ref: '#/components/responses/TooManyRequests'
      summary: Retrieve default configuration
      tags:
      - '[Integrations] New Relic'
      x-cortex-mcp-enabled: 'false'
components:
  schemas:
    MultipleConfigurationsResponseNewrelicConfiguration:
      required:
      - configurations
      - skippedConfigurations
      type: object
      properties:
        configurations:
          type: array
          items:
            $ref: '#/components/schemas/NewrelicConfiguration'
        skippedConfigurations:
          type: object
          additionalProperties:
            type: string
    IntegrationConfigValidation:
      required:
      - isValid
      type: object
      properties:
        alias:
          type: string
        isValid:
          type: boolean
        message:
          type: string
    ErrorResponse:
      required:
      - message
      - type
      type: object
      properties:
        details:
          type: string
        errorCode:
          type: string
        gatewayHttpStatus:
          type: integer
          format: int32
        httpStatus:
          type: integer
          format: int32
        message:
          type: string
        requestId:
          type: string
        type:
          type: string
          enum:
          - INTEGRATION_MISSING
          - INTEGRATION_UNREGISTERED
          - INTEGRATION_UNSUPPORTED
          - INTEGRATION_GRAPHQL_ERROR
          - INTEGRATION_BAD_REQUEST
          - INTEGRATION_UNAUTHORIZED
          - INTEGRATION_FORBIDDEN
          - INTEGRATION_NOT_FOUND
          - INTEGRATION_UNPROCESSABLE_CONTENT
          - INTEGRATION_RATE_LIMITED
          - INTEGRATION_INTERNAL_ERROR
          - INTEGRATION_NOT_IMPLEMENTED
          - INTEGRATION_BAD_GATEWAY
          - INTEGRATION_UNAVAILABLE
          - INTEGRATION_GATEWAY_TIMEOUT
          - INTEGRATION_TIMED_OUT
          - INTEGRATION_CACHE_ERROR
          - INTEGRATION_UNHANDLED_HTTP_ERROR
          - INTEGRATION_UNHANDLED_EXCEPTION
          - INTEGRATION_UNEXPECTED_ERROR
          - ILLEGAL_ARGUMENT_ERROR
          - BAD_REQUEST
          - FORBIDDEN
          - NOT_FOUND
          - REQUEST_TIMEOUT
          - CONFLICT
          - UNHANDLED_EXCEPTION
          - UNCATEGORIZED
          - SERVICE_CREATOR
          - UNKNOWN_HOST
          - TOO_MANY_REQUESTS
    NewrelicConfiguration:
      required:
      - alias
      - isDefault
      - lastFour
      - region
      type: object
      properties:
        accountId:
          type: integer
          format: int32
        alias:
          type: string
        isDefault:
          type: boolean
        lastFour:
          type: string
        region:
          type: string
          enum:
          - US
          - EU
    NewrelicUpdateConfigurationRequest:
      required:
      - alias
      - isDefault
      type: object
      properties:
        accountId:
          type: integer
          format: int32
        alias:
          type: string
        isDefault:
          type: boolean
        personalKey:
          type: string
        region:
          type: string
          enum:
          - US
          - EU
    ConfigurationsResponseNewrelicConfiguration:
      required:
      - configurations
      type: object
      properties:
        configurations:
          type: array
          items:
            $ref: '#/components/schemas/NewrelicConfiguration'
    MultipleIntegrationConfigValidation:
      required:
      - configurations
      type: object
      properties:
        configurations:
          type: array
          items:
            $ref: '#/components/schemas/IntegrationConfigValidation'
    TooManyRequestsProblemDetail:
      required:
      - type
      - title
      - status
      type: object
      properties:
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        retryAfter:
          minimum: 0
          type: integer
          description: The number of seconds until the rate limiting resets.
          format: int32
        status:
          maximum: 599
          minimum: 100
          type: integer
          format: int32
          enum:
          - 429
        title:
          type: string
        type:
          type: string
          format: uri-reference
    NewrelicConfigurationRequest:
      required:
      - accountId
      - alias
      - isDefault
      - personalKey
      - region
      type: object
      properties:
        accountId:
          type: integer
          format: int32
        alias:
          type: string
        isDefault:
          type: boolean
        personalKey:
          type: string
        region:
          type: string
          enum:
          - US
          - EU
    ConfigurationsRequestNewrelicConfigurationRequest:
      required:
      - configurations
      type: object
      properties:
        configurations:
          type: array
          items:
            $ref: '#/components/schemas/NewrelicConfigurationRequest'
  responses:
    TooManyRequests:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/TooManyRequestsProblemDetail'
      description: The client has exceeded the rate limit by performing too many requests in a short period. Retry the request after a delay.
      headers:
        Retry-After:
          description: The number of seconds until the rate limiting resets.
          schema:
            minimum: 0
            type: integer
            format: int32
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      description: 'All requests to the Cortex API need to provide an `Authorization: Bearer <token>` header, where `<token>` is an API key created in the Settings page of your workspace.'
      scheme: bearer
      type: http
x-provenance:
  method: harvested
  publisher: Cortex
  source: https://docs.cortex.io/openapi/cortex_swagger.json
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
    stamped by stamp-openapi-provenance.py (roadmap#793)
