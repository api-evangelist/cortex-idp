openapi: 3.2.0
info:
  description: The Cortex REST API provides programmatic access to the data in the catalog, Scorecards, and more.
  title: Cortex Teams [Departments] (legacy) API
  version: v1
servers:
- url: https://api.getcortexapp.com
  description: Cortex Cloud API host
security:
- bearerAuth: []
tags:
- name: Teams [Departments] (legacy)
paths:
  /api/v1/teams/departments:
    delete:
      operationId: deleteDepartment
      parameters:
      - in: query
        name: departmentTag
        required: true
        schema:
          type: string
      responses:
        '204':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unit'
          description: Successfully deleted department
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Department not found
        '429':
          $ref: '#/components/responses/TooManyRequests'
      summary: Delete department
      tags:
      - Teams [Departments] (legacy)
      x-cortex-mcp-enabled: 'false'
    get:
      operationId: listDepartments
      parameters:
      - in: query
        name: departmentTag
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/DepartmentResponse'
                - $ref: '#/components/schemas/AllDepartmentsResponse'
          description: Successfully found department
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Department not found
        '429':
          $ref: '#/components/responses/TooManyRequests'
      summary: Retrieve department details
      tags:
      - Teams [Departments] (legacy)
      x-cortex-mcp-enabled: 'false'
    post:
      operationId: createDepartment
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDepartmentRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepartmentResponse'
          description: Successfully created a department
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        '429':
          $ref: '#/components/responses/TooManyRequests'
      summary: Create department
      tags:
      - Teams [Departments] (legacy)
      x-cortex-mcp-enabled: 'false'
    put:
      operationId: updateDepartment
      parameters:
      - in: query
        name: departmentTag
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDepartmentRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepartmentResponse'
          description: Successfully updated department
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Department not found
        '429':
          $ref: '#/components/responses/TooManyRequests'
      summary: Update department
      tags:
      - Teams [Departments] (legacy)
      x-cortex-mcp-enabled: 'false'
components:
  schemas:
    DepartmentResponse.BaseRole.TEAM_ROLE:
      title: TEAM_ROLE
      type: object
      allOf:
      - $ref: '#/components/schemas/BaseRole'
      - required:
        - name
        - tag
        type: object
        properties:
          name:
            type: string
          tag:
            type: string
    AllDepartmentsResponse:
      required:
      - departments
      type: object
      properties:
        departments:
          type: array
          items:
            $ref: '#/components/schemas/DepartmentResponse'
    UpdateDepartmentRequest:
      required:
      - members
      - name
      type: object
      properties:
        description:
          type: string
        members:
          type: array
          items:
            $ref: '#/components/schemas/DepartmentMemberRequest'
        name:
          type: string
    ErrorResponse:
      required:
      - message
      - type
      type: object
      properties:
        details:
          type: string
        errorCode:
          type: string
        gatewayHttpStatus:
          type: integer
          format: int32
        httpStatus:
          type: integer
          format: int32
        message:
          type: string
        requestId:
          type: string
        type:
          type: string
          enum:
          - INTEGRATION_MISSING
          - INTEGRATION_UNREGISTERED
          - INTEGRATION_UNSUPPORTED
          - INTEGRATION_GRAPHQL_ERROR
          - INTEGRATION_BAD_REQUEST
          - INTEGRATION_UNAUTHORIZED
          - INTEGRATION_FORBIDDEN
          - INTEGRATION_NOT_FOUND
          - INTEGRATION_UNPROCESSABLE_CONTENT
          - INTEGRATION_RATE_LIMITED
          - INTEGRATION_INTERNAL_ERROR
          - INTEGRATION_NOT_IMPLEMENTED
          - INTEGRATION_BAD_GATEWAY
          - INTEGRATION_UNAVAILABLE
          - INTEGRATION_GATEWAY_TIMEOUT
          - INTEGRATION_TIMED_OUT
          - INTEGRATION_CACHE_ERROR
          - INTEGRATION_UNHANDLED_HTTP_ERROR
          - INTEGRATION_UNHANDLED_EXCEPTION
          - INTEGRATION_UNEXPECTED_ERROR
          - ILLEGAL_ARGUMENT_ERROR
          - BAD_REQUEST
          - FORBIDDEN
          - NOT_FOUND
          - REQUEST_TIMEOUT
          - CONFLICT
          - UNHANDLED_EXCEPTION
          - UNCATEGORIZED
          - SERVICE_CREATOR
          - UNKNOWN_HOST
          - TOO_MANY_REQUESTS
    BaseRole:
      required:
      - type
      type: object
      properties:
        type:
          type: string
      discriminator:
        propertyName: type
      oneOf:
      - $ref: '#/components/schemas/DepartmentResponse.BaseRole.MISCONFIGURED'
      - $ref: '#/components/schemas/DepartmentResponse.BaseRole.TEAM_ROLE'
    DepartmentResponse.BaseRole.MISCONFIGURED:
      title: MISCONFIGURED
      type: object
      allOf:
      - $ref: '#/components/schemas/BaseRole'
      - required:
        - tag
        type: object
        properties:
          tag:
            type: string
    DepartmentMemberResponse:
      required:
      - email
      - name
      type: object
      properties:
        description:
          type: string
        email:
          type: string
        name:
          type: string
        role:
          $ref: '#/components/schemas/BaseRole'
    Unit:
      type: object
    CreateDepartmentRequest:
      required:
      - departmentTag
      - members
      - name
      type: object
      properties:
        departmentTag:
          type: string
          description: Unique identifier for the department, which is used for API operations
        description:
          type: string
        members:
          type: array
          items:
            $ref: '#/components/schemas/DepartmentMemberRequest'
        name:
          type: string
    DepartmentMemberRequest:
      required:
      - email
      - name
      type: object
      properties:
        description:
          type: string
        email:
          type: string
        name:
          type: string
        notificationsEnabled:
          type: boolean
        role:
          type: string
    TooManyRequestsProblemDetail:
      required:
      - type
      - title
      - status
      type: object
      properties:
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        retryAfter:
          minimum: 0
          type: integer
          description: The number of seconds until the rate limiting resets.
          format: int32
        status:
          maximum: 599
          minimum: 100
          type: integer
          format: int32
          enum:
          - 429
        title:
          type: string
        type:
          type: string
          format: uri-reference
    DepartmentResponse:
      required:
      - catalogEntityTag
      - departmentTag
      - id
      - members
      - name
      type: object
      properties:
        catalogEntityTag:
          type: string
        departmentTag:
          type: string
        description:
          type: string
        id:
          type: string
        members:
          type: array
          items:
            $ref: '#/components/schemas/DepartmentMemberResponse'
        name:
          type: string
  responses:
    TooManyRequests:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/TooManyRequestsProblemDetail'
      description: The client has exceeded the rate limit by performing too many requests in a short period. Retry the request after a delay.
      headers:
        Retry-After:
          description: The number of seconds until the rate limiting resets.
          schema:
            minimum: 0
            type: integer
            format: int32
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      description: 'All requests to the Cortex API need to provide an `Authorization: Bearer <token>` header, where `<token>` is an API key created in the Settings page of your workspace.'
      scheme: bearer
      type: http
x-provenance:
  method: harvested
  publisher: Cortex
  source: https://docs.cortex.io/openapi/cortex_swagger.json
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
    stamped by stamp-openapi-provenance.py (roadmap#793)
