openapi: 3.2.0
info:
  description: The Cortex REST API provides programmatic access to the data in the catalog, Scorecards, and more.
  title: Cortex Scorecards API
  version: v1
servers:
- url: https://api.getcortexapp.com
  description: Cortex Cloud API host
security:
- bearerAuth: []
tags:
- name: Scorecards
paths:
  /api/v1/scorecards:
    get:
      description: Returns scorecards matching optional search criteria. If search criteria is specified we will use search logic, which will not find Scorecards that have yet to be evaluated
      operationId: listScorecards
      parameters:
      - in: query
        name: showDrafts
        required: false
        schema:
          type: boolean
      - description: Filter based on groups, which correspond to the `x-cortex-groups` field in the Catalog Descriptor. Accepts a comma-delimited list of groups
        in: query
        name: groups
        required: false
        schema:
          type: array
          items:
            type: string
      - description: Filter based on entity (either tags or CIDs). Accepts a comma-delimited list of entity tag or CIDs, please use only one type of identifier
        in: query
        name: entities
        required: false
        schema:
          type: array
          items:
            type: string
            description: Entity identifier - can be a tag or CID
      - description: Filter based on team (either tags or CIDs). Accepts a comma-delimited list of team tag or CIDs, please use only one type of identifier
        in: query
        name: teams
        required: false
        schema:
          type: array
          items:
            type: string
            description: Entity identifier - can be a tag or CID
      - description: Page number to return, 0-indexed. Default 0.
        in: query
        name: page
        required: true
        schema:
          type: integer
          format: int32
          default: 0
      - description: Number of results to return per page, between 1 and 1000. Default 250.
        in: query
        name: pageSize
        required: true
        schema:
          type: integer
          format: int32
          default: 250
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedScorecardsResponse'
          description: OK
        '429':
          $ref: '#/components/responses/TooManyRequests'
      summary: List Scorecards
      tags:
      - Scorecards
      x-cortex-mcp-description: List all scorecards in the organization with optional filtering. View scorecard configurations to understand quality standards, compliance requirements, and maturity models. Supports filtering by groups, entities, and teams to find relevant scorecards.
      x-cortex-mcp-enabled: 'true'
  /api/v1/scorecards/descriptor:
    post:
      description: Create or update a Scorecard using the descriptor YAML. The operation is determined by the existence of a Scorecard with the same `tag` as passed in the descriptor.
      operationId: createOrUpdateScorecard
      parameters:
      - description: When true, this endpoint only validates the descriptor contents and returns any errors or warnings.
        in: query
        name: dryRun
        required: false
        schema:
          type: boolean
      requestBody:
        content:
          application/yaml;charset=UTF-8:
            schema:
              type: string
        description: "Raw text of the YAML  \n See an example of a yaml file for scorecards [here](https://docs.cortex.io/docs/reference/basics/scorecards#descriptor)"
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScorecardDescriptorResponse'
          description: Created Scorecard
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        '429':
          $ref: '#/components/responses/TooManyRequests'
      summary: Create or update Scorecard
      tags:
      - Scorecards
      x-cortex-mcp-description: Create a Scorecard from a raw YAML descriptor, or update the existing Scorecard if one with the descriptor's `tag` already exists. An update replaces the whole definition (rules, levels, filter) with the descriptor and does not merge fields, so call getScorecard(tag) first and send back the complete definition. Pass dryRun=true to parse and validate the YAML without saving anything.
      x-cortex-mcp-enabled: 'true'
  /api/v1/scorecards/exemptions:
    get:
      description: List rule exemptions across Scorecards, newest first. Callers with permission to view Scorecard exemptions see every exemption; other users see only the exemptions they requested.
      operationId: listScorecardRuleExemptions
      parameters:
      - description: Only return exemptions for the Scorecard with this tag
        in: query
        name: scorecardTag
        required: false
        schema:
          type: string
      - description: Only return exemptions for the entity with this tag (`x-cortex-tag`)
        in: query
        name: entityTag
        required: false
        schema:
          type: string
      - description: Only return exemptions for the rule with this identifier. Requires `scorecardTag`
        in: query
        name: ruleIdentifier
        required: false
        schema:
          type: string
      - description: Only return exemptions with this status. APPROVED excludes approvals past their end date, which are returned as EXPIRED.
        in: query
        name: status
        required: false
        schema:
          type: string
          enum:
          - PENDING
          - APPROVED
          - REJECTED
          - REVOKED
          - EXPIRED
      - description: Only return exemptions requested by the user with this email
        in: query
        name: requesterEmail
        required: false
        schema:
          type: string
      - description: Only return exemptions approved by the user with this email
        in: query
        name: approverEmail
        required: false
        schema:
          type: string
      - description: Only return exemptions that are pending, or approved and not yet expired. Default false.
        in: query
        name: onlyActive
        required: false
        schema:
          type: boolean
          default: false
      - description: Page number to return, 0-indexed. Default 0.
        in: query
        name: page
        required: true
        schema:
          type: integer
          format: int32
          default: 0
      - description: Number of results to return per page, between 1 and 1000. Default 250.
        in: query
        name: pageSize
        required: true
        schema:
          type: integer
          format: int32
          default: 250
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedRuleExemptionsResponse'
          description: Successfully retrieved Scorecard rule exemptions
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Rule identifier was provided without a Scorecard tag, EXPIRED status was combined with onlyActive, or the requested page starts beyond the first 100,000 results
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: API key without permission to view Scorecard exemptions and not tied to a user
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Scorecard not found, entity not found, or rule with given identifier not found within the Scorecard
        '429':
          $ref: '#/components/responses/TooManyRequests'
      summary: List Scorecard rule exemptions
      tags:
      - Scorecards
      x-cortex-mcp-description: List Scorecard rule exemptions, newest first, with their status, requester, approver and expiry. Filter by Scorecard tag, entity tag, rule identifier, status, requester or approver email, or only exemptions currently in effect; a rule identifier needs a Scorecard tag. Callers who can view Scorecard exemptions see every exemption; other callers see only the exemptions they requested.
      x-cortex-mcp-enabled: 'true'
  /api/v1/scorecards/{scorecardTag}/entity/{tagOrId}/badge:
    get:
      operationId: getBadgeMarkdown
      parameters:
      - description: Unique tag for the Scorecard.
        in: path
        name: scorecardTag
        required: true
        schema:
          type: string
      - description: The tag (`x-cortex-tag`) or unique, auto-generated identifier (CID) for the entity. If the tag contains forward slashes, URL-encode each `/` as `%2F`. The tag is matched exactly as encoded, including leading, trailing, and consecutive slashes, which are preserved and not collapsed (for example, the tag `/services/payments-api` is referenced as `%2Fservices%2Fpayments-api`). Tags containing slashes are supported via the API but not in the Cortex UI; this difference is expected.
        in: path
        name: tagOrId
        required: true
        schema:
          type: string
          description: Entity identifier - can be a tag or CID
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScorecardShieldsBadgeMarkdown'
          description: Shields.io badge
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Entity or Scorecard not found
        '429':
          $ref: '#/components/responses/TooManyRequests'
      summary: Retrieve Scorecard shields.io badge
      tags:
      - Scorecards
      x-cortex-mcp-enabled: 'false'
  /api/v1/scorecards/{tag}:
    delete:
      operationId: deleteScorecard
      parameters:
      - description: Unique tag for the Scorecard
        example: my-production-readiness-checklist
        in: path
        name: tag
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successfully deleted Scorecard
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Scorecard not found
        '429':
          $ref: '#/components/responses/TooManyRequests'
      summary: Delete Scorecard
      tags:
      - Scorecards
      x-cortex-mcp-description: Delete a scorecard. Disabled for MCP access as removing scorecards affects historical tracking and compliance reporting
      x-cortex-mcp-enabled: 'false'
    get:
      operationId: getScorecard
      parameters:
      - description: Unique tag for the Scorecard
        example: my-production-readiness-checklist
        in: path
        name: tag
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScorecardDescriptorResponse'
          description: Successfully retrieved Scorecard
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Scorecard not found
        '429':
          $ref: '#/components/responses/TooManyRequests'
      summary: Retrieve Scorecard
      tags:
      - Scorecards
      x-cortex-mcp-description: Get complete details of a scorecard including its configuration, rules, levels, weights, exemption settings, and evaluation criteria. Essential for understanding how services are evaluated and what standards they must meet.
      x-cortex-mcp-enabled: 'true'
  /api/v1/scorecards/{tag}/descriptor:
    get:
      operationId: getScorecardDescriptor
      parameters:
      - description: Unique tag for the Scorecard
        example: my-production-readiness-checklist
        in: path
        name: tag
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                type: string
          description: Successfully retrieved Scorecard descriptor
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Scorecard not found
        '429':
          $ref: '#/components/responses/TooManyRequests'
      summary: Retrieve Scorecard descriptor
      tags:
      - Scorecards
      x-cortex-mcp-description: Cortex Scorecards API - Measure and track service quality, compliance, and maturity levels across your organization with customizable scorecards and rules
      x-cortex-mcp-enabled: 'false'
  /api/v1/scorecards/{tag}/entity/{entityTag}/exemption:
    post:
      operationId: requestScorecardRuleExemption
      parameters:
      - description: Unique tag for the Scorecard
        example: my-production-readiness-checklist
        in: path
        name: tag
        required: true
        schema:
          type: string
      - description: The entity tag (`x-cortex-tag`) that identifies the entity.
        in: path
        name: entityTag
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuleExemptionRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleExemptionDefinition'
          description: Successfully requested Scorecard rule exemption
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Scorecard not found, entity not found, or rule with given identifier not found within the Scorecard
        '429':
          $ref: '#/components/responses/TooManyRequests'
      summary: Request Scorecard rule exemption
      tags:
      - Scorecards
      x-cortex-mcp-description: Request an exemption for one entity from one Scorecard rule, identified by Scorecard tag, entity tag and ruleIdentifier (call getScorecard to get it). A reason is required. Set `days` for an expiring exemption; leave it out and the exemption lasts until it is revoked. The exemption is approved at once if the caller has Edit Settings or the Scorecard auto-approves exemptions; otherwise it stays PENDING. Fails if the Scorecard has exemptions disabled, or if a pending or active exemption already exists for that rule and entity.
      x-cortex-mcp-enabled: 'true'
  /api/v1/scorecards/{tag}/entity/{entityTag}/exemption/approve:
    put:
      operationId: approveScorecardRuleExemption
      parameters:
      - description: Unique tag for the Scorecard
        example: my-production-readiness-checklist
        in: path
        name: tag
        required: true
        schema:
          type: string
      - description: The entity tag (`x-cortex-tag`) that identifies the entity.
        in: path
        name: entityTag
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveRuleExemptionRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModifiedRuleExemptionsResponse'
          description: Successfully approved Scorecard rule exemptions
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: No pending exemptions to approve found
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Scorecard not found, entity not found, or rule with given identifier not found within the Scorecard
        '429':
          $ref: '#/components/responses/TooManyRequests'
      summary: Approve Scorecard rule exemption
      tags:
      - Scorecards
      x-cortex-mcp-description: Approve every PENDING exemption for one rule on one entity, identified by Scorecard tag, entity tag and ruleIdentifier. Admin only. Fails with 400 when nothing is pending. Use listScorecardRuleExemptions to review requests before approving them.
      x-cortex-mcp-enabled: 'true'
  /api/v1/scorecards/{tag}/entity/{entityTag}/exemption/deny:
    put:
      operationId: denyScorecardRuleExemption
      parameters:
      - description: Unique tag for the Scorecard
        example: my-production-readiness-checklist
        in: path
        name: tag
        required: true
        schema:
          type: string
      - description: The entity tag (`x-cortex-tag`) that identifies the entity.
        in: path
        name: entityTag
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectRuleExemptionRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModifiedRuleExemptionsResponse'
          description: Denied Scorecard rule exemptions
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: No pending exemptions to approve found
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Scorecard not found, entity not found, or rule with given identifier not found within the Scorecard
        '429':
          $ref: '#/components/responses/TooManyRequests'
      summary: Deny Scorecard rule exemption
      tags:
      - Scorecards
      x-cortex-mcp-description: Deny (reject) every PENDING exemption for one rule on one entity, identified by Scorecard tag, entity tag and ruleIdentifier, with a required reason. Admin only. Fails with 400 when nothing is pending. To remove an exemption that is already approved, use revokeScorecardRuleExemption.
      x-cortex-mcp-enabled: 'true'
  /api/v1/scorecards/{tag}/entity/{entityTag}/exemption/revoke:
    put:
      operationId: revokeScorecardRuleExemption
      parameters:
      - description: Unique tag for the Scorecard
        example: my-production-readiness-checklist
        in: path
        name: tag
        required: true
        schema:
          type: string
      - description: The entity tag (`x-cortex-tag`) that identifies the entity.
        in: path
        name: entityTag
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevokeRuleExemptionRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModifiedRuleExemptionsResponse'
          description: Revoked Scorecard rule exemptions
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: No approved exemptions to revoke found
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Scorecard not found, entity not found, or rule with given identifier not found within the Scorecard
        '429':
          $ref: '#/components/responses/TooManyRequests'
      summary: Revoke Scorecard rule exemption
      tags:
      - Scorecards
      x-cortex-mcp-description: Revoke every APPROVED exemption for one rule on one entity, identified by Scorecard tag, entity tag and ruleIdentifier, with a required reason. The rule applies to the entity again, and the record is kept for audit. Admins or the original requester can revoke. Fails with 400 when no approved exemption exists. Use denyScorecardRuleExemption for a request that is still pending.
      x-cortex-mcp-enabled: 'true'
  /api/v1/scorecards/{tag}/entity/{entityTag}/scores:
    post:
      description: Triggers score evaluation for entity scorecard
      operationId: refreshScorecardScoreForEntity
      parameters:
      - description: Unique tag for the Scorecard
        example: my-production-readiness-checklist
        in: path
        name: tag
        required: true
        schema:
          type: string
      - description: The entity tag (`x-cortex-tag`) that identifies the entity.
        in: path
        name: entityTag
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Scorecard score evaluation triggered successfully
        '403':
          description: Unauthorized
        '404':
          description: Scorecard not found
        '409':
          description: Already evaluating scorecard
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: Scorecard evaluation failed
      summary: Evaluate entity scorecard score
      tags:
      - Scorecards
      x-cortex-mcp-description: Start a re-evaluation of one entity's score on one Scorecard, identified by Scorecard tag and entity tag. Requires the `Run Scorecards` permission. The call only starts the evaluation and returns no score; read the result afterwards with listScorecardScoresForEntity or getScorecardNextStepsForEntity. Returns 409 if this Scorecard is already being evaluated.
      x-cortex-mcp-enabled: 'true'
  /api/v1/scorecards/{tag}/next-steps:
    get:
      operationId: getScorecardNextStepsForEntity
      parameters:
      - description: Unique tag for the Scorecard
        example: my-production-readiness-checklist
        in: path
        name: tag
        required: true
        schema:
          type: string
      - description: The entity tag (`x-cortex-tag`) that identifies the entity.
        in: query
        name: entityTag
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NextSteps1'
          description: Any rules remaining for the entity to reach the next level in the Scorecard.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Scorecard not found
        '429':
          $ref: '#/components/responses/TooManyRequests'
      summary: Retrieve next steps for entity in Scorecard
      tags:
      - Scorecards
      x-cortex-mcp-description: Get actionable next steps for an entity to improve its scorecard performance. Shows which rules need to be satisfied to reach the next maturity level, helping teams prioritize improvements and track progress toward compliance goals.
      x-cortex-mcp-enabled: 'true'
  /api/v1/scorecards/{tag}/scores:
    get:
      description: Returns latest scores for all entities in the Scorecard
      operationId: listScorecardScores
      parameters:
      - description: Entity tag (x-cortex-tag)
        in: query
        name: entityTag
        schema:
          type: string
      - description: Unique tag for the Scorecard
        example: my-production-readiness-checklist
        in: path
        name: tag
        required: true
        schema:
          type: string
      - description: Number of results to return per page, between 1 and 1000. Default 250.
        in: query
        name: pageSize
        required: true
        schema:
          type: integer
          format: int32
          default: 250
      - description: Page number to return, 0-indexed. Default 0.
        in: query
        name: page
        required: true
        schema:
          type: integer
          format: int32
          default: 0
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScorecardServiceScore'
          description: Scorecard scores
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Scorecard not found
        '429':
          $ref: '#/components/responses/TooManyRequests'
      summary: Retrieve Scorecard scores
      tags:
      - Scorecards
      x-cortex-mcp-description: 'Retrieve scores for all entities evaluated by a specific scorecard. Returns paginated results showing how each service, resource, or domain performs against the scorecard''s rules, including individual rule scores and overall scorecard scores.


        Prefer searchScorecardScores for filter-based questions — listScorecardScores scans page-by-page and is expensive on large scorecards.'
      x-cortex-mcp-enabled: 'true'
components:
  schemas:
    RuleExemptionDefinition:
      required:
      - exemptionStatus
      - requestedBy
      - requestedDate
      - requestingReason
      type: object
      properties:
        endDate:
          type: string
          format: date-time
        exemptionStatus:
          $ref: '#/components/schemas/ExemptionStatus'
        requestedBy:
          $ref: '#/components/schemas/ExemptionActor'
        requestedDate:
          type: string
          format: date-time
        requestingReason:
          type: string
    PaginatedRuleExemptionsResponse:
      required:
      - exemptions
      - page
      - total
      - totalPages
      type: object
      properties:
        exemptions:
          type: array
          items:
            $ref: '#/components/schemas/RuleExemptionDetails'
        page:
          type: integer
          description: Current page number, 0-indexed
          format: int32
        total:
          type: integer
          description: Total number of results
          format: int32
        totalPages:
          type: integer
          description: Total number of pages
          format: int32
    CurrentLevel:
      required:
      - name
      - number
      type: object
      properties:
        name:
          type: string
          description: Name of the level
          example: Bronze
        number:
          type: integer
          description: Rank of the level where 1 is the highest
          format: int32
    ServiceOwners:
      required:
      - groups
      - individuals
      type: object
      properties:
        groups:
          type: array
          description: Not to be confused with x-cortex-groups. These are the slugs of IdP or Cortex Managed Teams
          items:
            type: string
            description: Not to be confused with x-cortex-groups. These are the slugs of IdP or Cortex Managed Teams
        individuals:
          type: array
          items:
            $ref: '#/components/schemas/IndividualServiceOwner'
    ModifiedRuleExemptionsResponse:
      required:
      - exemptions
      type: object
      properties:
        exemptions:
          type: array
          items:
            $ref: '#/components/schemas/RuleExemptionDefinition'
    RuleOutcome:
      required:
      - expression
      - score
      type: object
      properties:
        error:
          type: string
        expression:
          type: string
        identifier:
          type: string
        score:
          type: number
    ExemptionsSettings:
      required:
      - autoApprove
      - enabled
      type: object
      properties:
        autoApprove:
          type: boolean
          description: This will enable auto-approving of Scorecard rule exemptions. If not set, it defaults to false.
          example: false
        enabled:
          type: boolean
          description: This will enable Scorecard rule exemptions. If not set, it defaults to true.
          example: true
      description: Exemptions settings for the Scorecard
    ExemptionActor:
      required:
      - type
      type: object
      properties:
        type:
          type: string
      description: API key or person who approved the exemption before it was revoked. Only set when the status is REVOKED
      discriminator:
        mapping:
          API: '#/components/schemas/RuleExemptionApiActor'
          USER: '#/components/schemas/RuleExemptionUserActor'
        propertyName: type
      oneOf:
      - $ref: '#/components/schemas/RuleExemptionUserActor'
      - $ref: '#/components/schemas/RuleExemptionApiActor'
    ScorecardRule:
      required:
      - expression
      type: object
      properties:
        description:
          type: string
          example: This rule is very important because you must pass it
        effectiveFrom:
          type: string
          description: Date when the rule starts being evaluated
          format: date-time
          example: '2024-01-01T00:00:00Z'
        expression:
          type: string
          description: CQL representation of the rule
          example: custom("key") = "value"
        failureMessage:
          type: string
          example: To fix this rule, visit [our internal doc][docs.cortex.io]
        filter:
          $ref: '#/components/schemas/Filter'
        identifier:
          type: string
          description: Unique identifier of the rule
          example: 96db03f1-2529-3fc3-9f13-7fb4dd28f427
        levelName:
          type: string
          description: Name of the level this rule is associated with, if applicable
        title:
          type: string
          example: Key value must be correct
        weight:
          type: number
          description: Numerical weight of the rule. When using levels, this defaults to 1
      description: List of rules that are evaluated each time the Scorecard is evaluated
    ScorecardServiceScore:
      required:
      - scorecardId
      - scorecardName
      - scorecardTag
      - serviceScores
      type: object
      properties:
        scorecardFilter:
          $ref: '#/components/schemas/Filter'
        scorecardId:
          type: integer
          format: int64
        scorecardName:
          type: string
        scorecardTag:
          type: string
        serviceScores:
          type: array
          items:
            $ref: '#/components/schemas/ServiceScore'
    RuleExemptionRequest:
      required:
      - reason
      - ruleIdentifier
      type: object
      properties:
        days:
          type:
          - integer
          - 'null'
          description: Number of days how long rule should be exempt. If not set, rule will be exempt until exempt until revoked.
          format: int64
        reason:
          type: string
          description: Reason for creating exemption
        ruleIdentifier:
          type: string
          description: Identifier of the Scorecard rule to request exemption for
    Notifications:
      required:
      - enabled
      - scoreDropNotificationsEnabled
      type: object
      properties:
        enabled:
          type: boolean
          description: Whether this Scorecard should be included in notifications. If not set, it defaults to true for non-draft Scorecards and to false for draft Scorecards
          example: true
        scoreDropNotificationsEnabled:
          type: boolean
          description: Whether to notify when an entities' score drops after a Scorecard evaluation. If not set, it defaults to false
          example: true
      description: Notification settings for the Scorecard
    Rule:
      required:
      - expression
      type: object
      properties:
        description:
          type: string
        expression:
          type: string
        identifier:
          type: string
        title:
          type: string
    RuleExemptionDetails:
      required:
      - entityName
      - entityTag
      - exemptionStatus
      - id
      - requestedApprovers
      - requestedBy
      - requestedDate
      - requestingReason
      - ruleExpression
      - ruleIdentifier
      - scorecardName
      - scorecardTag
      type: object
      properties:
        endDate:
          type:
          - string
          - 'null'
          description: Date on which the exemption will expire. Null if there is no expiration date
          format: date-time
        entityName:
          type: string
          description: Name of the exempted entity
        entityTag:
          type: string
          description: Tag (`x-cortex-tag`) of the exempted entity
        exemptionStatus:
          $ref: '#/components/schemas/ExemptionStatus'
        id:
          type: integer
          description: Unique identifier of the exemption
          format: int64
        requestedApprovers:
          type: array
          description: Emails of the users asked to approve the exemption
          items:
            type: string
            description: Emails of the users asked to approve the exemption
        requestedBy:
          $ref: '#/components/schemas/ExemptionActor'
        requestedDate:
          type: string
          description: Date on which the exemption was requested
          format: date-time
        requestingReason:
          type: string
          description: Reason supplied for requesting the exemption
        ruleExpression:
          type: string
          description: CQL representation of the rule
        ruleIdentifier:
          type: string
          description: Identifier of the rule
        ruleTitle:
          type:
          - string
          - 'null'
          description: Title of the rule
        scorecardName:
          type: string
          description: Name of the Scorecard the rule belongs to
        scorecardTag:
          type: string
          description: Tag of the Scorecard the rule belongs to
    ExemptionStatus:
      required:
      - status
      type: object
      properties:
        approvedBy:
          $ref: '#/components/schemas/ExemptionActor'
        approvedDate:
          type: string
          description: Date on which the exemption was approved before it was revoked. Only set when the status is REVOKED
          format: date-time
        date:
          type: string
          description: Date on which the exemption was approved, rejected, or revoked. Null if the status is pending
          format: date-time
        handledBy:
          $ref: '#/components/schemas/ExemptionActor'
        status:
          type: string
          description: Status of the exemption. Possible values are APPROVED, REJECTED, PENDING, REVOKED, and EXPIRED
      description: Status of the exemption, which describes whether it is approved, rejected, pending, revoked, or expired
    ErrorResponse:
      required:
      - message
      - type
      type: object
      properties:
        details:
          type: string
        errorCode:
          type: string
        gatewayHttpStatus:
          type: integer
          format: int32
        httpStatus:
          type: integer
          format: int32
        message:
          type: string
        requestId:
          type: string
        type:
          type: string
          enum:
          - INTEGRATION_MISSING
          - INTEGRATION_UNREGISTERED
          - INTEGRATION_UNSUPPORTED
          - INTEGRATION_GRAPHQL_ERROR
          - INTEGRATION_BAD_REQUEST
          - INTEGRATION_UNAUTHORIZED
          - INTEGRATION_FORBIDDEN
          - INTEGRATION_NOT_FOUND
          - INTEGRATION_UNPROCESSABLE_CONTENT
          - INTEGRATION_RATE_LIMITED
          - INTEGRATION_INTERNAL_ERROR
          - INTEGRATION_NOT_IMPLEMENTED
          - INTEGRATION_BAD_GATEWAY
          - INTEGRATION_UNAVAILABLE
          - INTEGRATION_GATEWAY_TIMEOUT
          - INTEGRATION_TIMED_OUT
          - INTEGRATION_CACHE_ERROR
          - INTEGRATION_UNHANDLED_HTTP_ERROR
          - INTEGRATION_UNHANDLED_EXCEPTION
          - INTEGRATION_UNEXPECTED_ERROR
          - ILLEGAL_ARGUMENT_ERROR
          - BAD_REQUEST
          - FORBIDDEN
          - NOT_FOUND
          - REQUEST_TIMEOUT
          - CONFLICT
          - UNHANDLED_EXCEPTION
          - UNCATEGORIZED
          - SERVICE_CREATOR
          - UNKNOWN_HOST
          - TOO_MANY_REQUESTS
    ScoreDetails:
      required:
      - ladderLevels
      - rules
      - summary
      type: object
      properties:
        ladderLevels:
          type: array
          items:
            $ref: '#/components/schemas/LadderLevel'
        rules:
          type: array
          items:
            $ref: '#/components/schemas/RuleOutcome'
        summary:
          $ref: '#/components/schemas/ScoreSummary'
    ScoreSummary:
      required:
      - percentage
      - score
      - totalPossibleScore
      type: object
      properties:
        percentage:
          type: number
        score:
          type: number
        totalPossibleScore:
          type: number
    ScorecardResponse:
      required:
      - dateCreated
      - exemptions
      - isDraft
      - lastUpdated
      - name
      - notifications
      - rules
      - tag
      type: object
      properties:
        dateCreated:
          type: string
          description: Time the Scorecard was created
          format: date-time
        description:
          type: string
          description: Human-readable description of the Scorecard
        evaluation:
          $ref: '#/components/schemas/EvaluationDetails'
        exemptions:
          $ref: '#/components/schemas/ExemptionsSettings'
        filter:
          $ref: '#/components/schemas/Filter'
        isDraft:
          type: boolean
          description: Whether or not the Scorecard is in draft
        lastUpdated:
          type: string
          description: Time the Scorecard was last updated, which includes setting the next evaluation time
          format: date-time
        levels:
          type: array
          description: List of levels associated with the Scorecard
          items:
            $ref: '#/components/schemas/LadderLevel'
        name:
          type: string
          description: Human-readable name
          example: Production Readiness Scorecard
        notifications:
          $ref: '#/components/schemas/Notifications'
        rules:
          type: array
          description: List of rules that are evaluated each time the Scorecard is evaluated
          items:
            $ref: '#/components/schemas/ScorecardRule'
        tag:
          type: string
          description: Unique identifier, found in the UI
          example: production-readiness-scorecard
    PaginatedScorecardsResponse:
      required:
      - page
      - scorecards
      - total
      - totalPages
      type: object
      properties:
        page:
          type: integer
          description: Current page number, 0-indexed
          format: int32
        scorecards:
          type: array
          items:
            $ref: '#/components/schemas/ScorecardResponse'
        total:
          type: integer
          description: Total number of results
          format: int32
        totalPages:
          type: integer
          description: Total number of pages
          format: int32
    ServiceScore:
      required:
      - lastEvaluated
      - ruleExemptions
      - score
      - service
      type: object
      properties:
        lastEvaluated:
          type: string
          format: date-time
        ruleExemptions:
          type: array
          items:
            $ref: '#/components/schemas/RuleExemptionDefinitionWithRule'
        score:
          $ref: '#/components/schemas/ScoreDetails'
        service:
          $ref: '#/components/schemas/ServiceDetails'
    EvaluationDetails:
      type: object
      properties:
        window:
          type: integer
          description: Number of hours between Scorecard evaluations. If the evaluation window is not set, the Scorecard is evaluated every 4 hours
          format: int64
          example: 4
      description: Evaluation window for how often the Scorecard is run
    TypeFilter:
      type: object
      properties:
        exclude:
          uniqueItems: true
          type: array
          items:
            type: string
        include:
          uniqueItems: true
          type: array
          items:
            type: string
      description: Entity types (e.g. service, domain, team) to include or exclude. Only one of `include` or `exclude` can be set
    RuleExemptionDefinitionWithRule:
      required:
      - exemptionStatus
      - requestedBy
      - requestedDate
      - requestingReason
      - ruleExpression
      - ruleIdentifier
      type: object
      properties:
        endDate:
          type: string
          format: date-time
        exemptionStatus:
          $ref: '#/components/schemas/ExemptionStatus'
        requestedBy:
          $ref: '#/components/schemas/ExemptionActor'
        requestedDate:
          type: string
          format: date-time
        requestingReason:
          type: string
        ruleExpression:
          type: string
          description: CQL representation of the rule
        ruleIdentifier:
          type: string
          description: Identifier of the rule
    ApproveRuleExemptionRequest:
      required:
      - ruleIdentifier
      type: object
      properties:
        ruleIdentifier:
          type: string
          description: Identifier of the Scorecard rule
    ScorecardDescriptorResponse:
      required:
      - scorecard
      type: object
      properties:
        scorecard:
          $ref: '#/components/schemas/ScorecardResponse'
    RevokeRuleExemptionRequest:
      required:
      - reason
      - ruleIdentifier
      type: object
      properties:
        reason:
          type: string
          description: Reason for revoking the exemption
        ruleIdentifier:
          type: string
          description: Identifier of the Scorecard rule
    RuleExemptionUserActor:
      type: object
      description: Person who requested, approved or rejected the exemption
      allOf:
      - $ref: '#/components/schemas/ExemptionActor'
      - required:
        - email
        - name
        type: object
        properties:
          email:
            type: string
            description: Email of the person who requested, approved or rejected the exemption
          name:
            type: string
            description: Name of the person who requested, approved or rejected the exemption
    NextSteps:
      required:
      - rulesToComplete
      type: object
      properties:
        currentLevel:
          $ref: '#/components/schemas/LadderLevel'
        nextLevel:
          $ref: '#/components/schemas/LadderLevel'
        rulesToComplete:
          type: array
          items:
            $ref: '#/components/schemas/Rule'
    RejectRuleExemptionRequest:
      required:
      - reason
      - ruleIdentifier
      type: object
      properties:
        reason:
          type: string
        ruleIdentifier:
          type: string
          description: Identifier of the Scorecard rule
    ScorecardShieldsBadgeMarkdown:
      required:
      - value
      type: object
      properties:
        value:
          type: string
    IndividualServiceOwner:
      required:
      - email
      type: object
      properties:
        description:
          type: string
        email:
          type: string
    ServiceDetails:
      required:
      - groups
      - id
      - name
      - owners
      - tag
      type: object
      properties:
        groups:
          type: array
          description: Not to be confused with owners. This refers to the x-cortex-groups field of the entity.
          items:
            type: string
            description: Not to be confused with owners. This refers to the x-cortex-groups field of the entity.
        id:
          type: string
          description: Unique, immutable, 18-character auto-generated identifier for the entity.
          example: en2da8159dbeefb974
        name:
          type: string
          description: Human-readable name for the entity.
          example: My Favorite Entity
        owners:
          $ref: '#/components/schemas/ServiceOwners'
        tag:
          type: string
          description: Unique identifier for the entity. Corresponds to the x-cortex-tag field in the entity descriptor.
          example: my-favorite-entity
    GroupFilter:
      type: object
      properties:
        exclude:
          uniqueItems: true
          type: array
          items:
            type: string
        include:
          uniqueItems: true
          type: array
          items:
            type: string
      description: Entity groups to include or exclude
    TooManyRequestsProblemDetail:
      required:
      - type
      - title
      - status
      type: object
      properties:
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        retryAfter:
          minimum: 0
          type: integer
          description: The number of seconds until the rate limiting resets.
          format: int32
        status:
          maximum: 599
          minimum: 100
          type: integer
          format: int32
          enum:
          - 429
        title:
          type: string
        type:
          type: string
          format: uri-reference
    Filter:
      type: object
      properties:
        groups:
          $ref: '#/components/schemas/GroupFilter'
        query:
          type: string
          description: CQL expression to apply as a filter
        types:
          $ref: '#/components/schemas/TypeFilter'
      description: Filter that selects the entities in the catalog, for `FILTER` catalogs
    NextSteps1:
      required:
      - nextSteps
      type: object
      properties:
        nextSteps:
          type: array
          items:
            $ref: '#/components/schemas/NextSteps'
    LadderLevel:
      type: object
      properties:
        level:
          $ref: '#/components/schemas/CurrentLevel'
    RuleExemptionApiActor:
      type: object
      description: Api key used to request, approve or reject the exemption
      allOf:
      - $ref: '#/components/schemas/ExemptionActor'
      - required:
        - apiKeyLast4
        type: object
        properties:
          apiKeyLast4:
            type: string
            description: Last 4 digits of the API key used to approve or reject the exemption
  responses:
    TooManyRequests:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/TooManyRequestsProblemDetail'
      description: The client has exceeded the rate limit by performing too many requests in a short period. Retry the request after a delay.
      headers:
        Retry-After:
          description: The number of seconds until the rate limiting resets.
          schema:
            minimum: 0
            type: integer
            format: int32
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      description: 'All requests to the Cortex API need to provide an `Authorization: Bearer <token>` header, where `<token>` is an API key created in the Settings page of your workspace.'
      scheme: bearer
      type: http
