      allOf:
      - $ref: '#/components/schemas/InputOverride'
      - required:
        - inputKey
        - outputVariable
        - type
        type: object
        properties:
          inputKey:
            type: string
            description: The input key to override
          outputVariable:
            type: string
            description: The path to the override value, as a dot path into the run data that starts with `context`, `actions` or `variables`, e.g. `variables.team-tags`.
          type:
            type: string
    OpenApiResponse:
      required:
      - ok
      - violations
      type: object
      properties:
        ok:
          type: boolean
        violations:
          type: array
          items:
            $ref: '#/components/schemas/ViolationDTO'
    WorkflowRunScopeRequest:
      required:
      - type
      type: object
      properties:
        type:
          type: string
          description: 'Must match the workflow filter type: `GLOBAL` for a GLOBAL filter, `ENTITY` for an ENTITY filter'
          enum:
          - GLOBAL
          - ENTITY
      description: Scope of the workflow run (e.g., target entities)
      discriminator:
        propertyName: type
      oneOf:
      - $ref: '#/components/schemas/WorkflowRunScopeRequest.GLOBAL'
      - $ref: '#/components/schemas/WorkflowRunScopeRequest.ENTITY'
  responses:
    TooManyRequests:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/TooManyRequestsProblemDetail'
      description: The client has exceeded the rate limit by performing too many requests in a short period. Retry the request after a delay.
      headers:
        Retry-After:
          description: The number of seconds until the rate limiting resets.
          schema:
            minimum: 0
            type: integer
            format: int32
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      description: 'All requests to the Cortex API need to provide an `Authorization: Bearer <token>` header, where `<token>` is an API key created in the Settings page of your workspace.'
      scheme: bearer
      type: http
