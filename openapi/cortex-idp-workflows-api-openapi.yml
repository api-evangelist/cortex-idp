openapi: 3.2.0
info:
  description: The Cortex REST API provides programmatic access to the data in the catalog, Scorecards, and more.
  title: Cortex Workflows API
  version: v1
servers:
- url: https://api.getcortexapp.com
  description: Cortex Cloud API host
security:
- bearerAuth: []
tags:
- name: Workflows
paths:
  /api/v1/workflows:
    get:
      description: 'List workflows.


        API key must have the `View workflows` permission.'
      operationId: listWorkflows
      parameters:
      - description: When true, returns the list of actions for each workflow. Defaults to false.
        in: query
        name: includeActions
        required: false
        schema:
          type: boolean
          default: false
      - description: When set, only returns workflows with the given substring in the name or description.
        in: query
        name: searchQuery
        required: false
        schema:
          type: string
      - description: Number of results to return per page, between 1 and 1000. Default 250.
        in: query
        name: pageSize
        required: true
        schema:
          type: integer
          format: int32
          default: 250
      - description: Page number to return, 0-indexed. Default 0.
        in: query
        name: page
        required: true
        schema:
          type: integer
          format: int32
          default: 0
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowListResponse'
            application/yaml:
              schema:
                $ref: '#/components/schemas/WorkflowListResponse'
          description: Successfully found workflows
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/yaml:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Access denied
        '429':
          $ref: '#/components/responses/TooManyRequests'
      summary: List workflows
      tags:
      - Workflows
      x-cortex-mcp-description: List the workflows defined in this workspace, with their tags, names and descriptions. Use this to find the workflow tag that getWorkflow, runWorkflow and listWorkflowRuns need.
      x-cortex-mcp-enabled: 'true'
    post:
      description: 'Create or update new workflow.


        API key must have the `Edit workflows` permission.


        **Note:** If a workflow with the same tag already exists, it will be updated.'
      operationId: createOrUpdateWorkflow
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowDefinition'
          application/yaml:
            schema:
              $ref: '#/components/schemas/WorkflowDefinition'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowDefinition'
            application/yaml:
              schema:
                $ref: '#/components/schemas/WorkflowDefinition'
          description: Workflow created successfully
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/yaml:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad request
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/yaml:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Access denied
        '429':
          $ref: '#/components/responses/TooManyRequests'
      summary: Create or update workflow
      tags:
      - Workflows
      x-cortex-mcp-description: Create a new workflow, or update an existing one if a workflow with the same tag already exists. An update fully replaces the prior definition rather than merging fields. The caller must have the `Edit workflows` permission. Prefer getWorkflow(tag) first when updating, to base the new definition on the current one.
      x-cortex-mcp-enabled: 'true'
  /api/v1/workflows/runs:
    get:
      description: 'List workflow runs based on filters.


        API key must have the `View workflow runs` permission.'
      operationId: listWorkflowRuns
      parameters:
      - description: When true, the response includes the run context. Defaults to false for MCP clients and true otherwise.
        in: query
        name: includeContext
        required: false
        schema:
          type: boolean
      - description: Filter by workflow tag or CID. Repeat the parameter for several workflows.
        in: query
        name: workflowIds
        schema:
          type: array
          items:
            type: string
      - description: Search query for workflow name or description
        in: query
        name: searchQuery
        schema:
          type: string
      - description: Filter by target entity tag or CID
        in: query
        name: entityId
        schema:
          type: string
      - description: Filter by the email of the user who initiated the run. Repeat the parameter for several users.
        in: query
        name: initiatedBy
        schema:
          type: array
          items:
            type: string
      - description: Filter runs started after this time (UTC, without an offset, e.g. 2026-06-22T00:00:00). Runs older than 30 days are never returned.
        in: query
        name: startedAfter
        schema:
          type: string
      - description: Filter runs started before this time (UTC, without an offset, e.g. 2026-06-22T00:00:00)
        in: query
        name: startedBefore
        schema:
          type: string
      - description: Page number, starting at 0
        in: query
        name: page
        schema:
          minimum: 0
          type: integer
          default: 0
      - description: Number of runs per page
        in: query
        name: size
        schema:
          minimum: 1
          type: integer
          default: 10
      - description: Sort as `property,direction`. Defaults to `dateCreated,desc`.
        in: query
        name: sort
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResultWorkflowRunSummaryResponse'
          description: Successfully found workflow runs
        '429':
          $ref: '#/components/responses/TooManyRequests'
      summary: List workflow runs
      tags:
      - Workflows
      x-cortex-mcp-description: List workflow runs across the workspace, newest first. Each run names the workflow, who or what started it, its state and when it finished. Use this to answer whether a workflow fired and whether it succeeded. Filter with workflowIds, initiatedBy, entityId and startedAfter/startedBefore; only runs from the last 30 days are returned. The run context is left out unless includeContext=true.
      x-cortex-mcp-enabled: 'true'
  /api/v1/workflows/validate:
    post:
      description: Validates YAML descriptor.
      operationId: validateWorkflowDescriptor
      requestBody:
        content:
          application/json:
            schema:
              type: string
          application/yaml:
            schema:
              type: string
        description: Raw text of the YAML
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenApiResponse'
          description: Validation result
        '429':
          $ref: '#/components/responses/TooManyRequests'
      summary: Validates YAML descriptor
      tags:
      - Workflows
      x-cortex-mcp-description: Check a workflow descriptor (raw YAML or JSON) without saving anything. Returns ok plus a list of violations. Call this before createOrUpdateWorkflow to catch errors.
      x-cortex-mcp-enabled: 'true'
  /api/v1/workflows/{tagOrId}:
    delete:
      description: 'Delete workflow by tag or ID.


        API key must have the `Edit workflows` permission.'
      operationId: deleteWorkflow
      parameters:
      - description: The tag or unique, auto-generated identifier for the workflow.
        in: path
        name: tagOrId
        required: true
        schema:
          type: string
          description: Entity identifier - can be a tag or CID
      responses:
        '200':
          description: Workflow deleted successfully
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/yaml:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Workflow not found
        '429':
          $ref: '#/components/responses/TooManyRequests'
      summary: Delete workflow
      tags:
      - Workflows
      x-cortex-mcp-description: Cortex Workflows API - Automate processes by defining triggers and actions, and run and inspect workflow executions
      x-cortex-mcp-enabled: 'false'
    get:
      description: 'Retrieve workflow by tag or ID.


        API key must have the `View workflows` permission.'
      operationId: getWorkflow
      parameters:
      - description: The tag or unique, auto-generated identifier for the workflow.
        in: path
        name: tagOrId
        required: true
        schema:
          type: string
          description: Entity identifier - can be a tag or CID
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowDefinition'
            application/yaml:
              schema:
                $ref: '#/components/schemas/WorkflowDefinition'
          description: Successfully found workflow
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/yaml:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Access denied
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/yaml:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Workflow not found
        '429':
          $ref: '#/components/responses/TooManyRequests'
      summary: Retrieve workflow
      tags:
      - Workflows
      x-cortex-mcp-description: Get one workflow by tag or CID, including the actions it runs and the inputs it takes. Use listWorkflows to find the tag.
      x-cortex-mcp-enabled: 'true'
  /api/v1/workflows/{tagOrId}/callback/{callbackId}:
    post:
      description: 'Updates an asynchronous HTTP request Workflow block.


        API key must have the `Edit workflow runs` permission.'
      operationId: workflowsAsyncHttpCallback
      parameters:
      - description: The tag or unique, auto-generated identifier for the workflow.
        in: path
        name: tagOrId
        required: true
        schema:
          type: string
          description: Entity identifier - can be a tag or CID
      - description: Callback ID; Provided by the Workflow block when it runs
        in: path
        name: callbackId
        required: true
        schema:
          type: string
          description: Callback ID; Provided by the Workflow block when it runs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CallbackRequest'
          application/yaml:
            schema:
              $ref: '#/components/schemas/CallbackRequest'
        required: true
      responses:
        '200':
          description: Successfully received Workflow callback
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/yaml:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad request
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/yaml:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Access denied
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/yaml:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Workflow run or block not found
        '406':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/yaml:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Workflow block is not waiting for callback
        '429':
          $ref: '#/components/responses/TooManyRequests'
      summary: Update asynchronous HTTP request Workflow block
      tags:
      - Workflows
      x-cortex-mcp-description: Cortex Workflows API - Automate processes by defining triggers and actions, and run and inspect workflow executions
      x-cortex-mcp-enabled: 'false'
  /api/v1/workflows/{tagOrId}/runs:
    post:
      description: 'Start a new run for a workflow.


        API key must have the `Run workflows` permission and the workflow must be runnable via API'
      operationId: runWorkflow
      parameters:
      - description: The tag or unique, auto-generated identifier for the workflow.
        in: path
        name: tagOrId
        required: true
        schema:
          type: string
          description: Entity identifier - can be a tag or CID
      - description: When true, the response includes the run context. Defaults to false for MCP clients and true otherwise.
        in: query
        name: includeContext
        required: false
        schema:
          type: boolean
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowRunRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowRunDetailsResponse'
          description: Workflow run started successfully
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Access denied or running workflow is disabled
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Workflow not found
        '429':
          $ref: '#/components/responses/TooManyRequests'
      summary: Run a workflow
      tags:
      - Workflows
      x-cortex-mcp-description: Start a new run for a workflow. The workflow must be runnable via API and the caller must have the `Run workflows` permission. The scope type must match the workflow filter type. Set workflow variables with initialContext. Returns the run's initial status and run id for polling via getWorkflowRun. The run context is left out unless includeContext=true.
      x-cortex-mcp-enabled: 'true'
  /api/v1/workflows/{tagOrId}/runs/{runId}:
    get:
      description: 'Retrieve details of a specific workflow run.


        API key must have the `View workflow runs` permission.'
      operationId: getWorkflowRun
      parameters:
      - description: The tag or unique, auto-generated identifier for the workflow.
        in: path
        name: tagOrId
        required: true
        schema:
          type: string
          description: Entity identifier - can be a tag or CID
      - description: The ID of the run, from runWorkflow or listWorkflowRuns
        in: path
        name: runId
        required: true
        schema:
          type: string
      - description: When true, the response includes the run context. Defaults to false for MCP clients and true otherwise.
        in: query
        name: includeContext
        required: false
        schema:
          type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowRunDetailsResponse'
          description: Successfully found workflow run
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Workflow or run not found
        '429':
          $ref: '#/components/responses/TooManyRequests'
      summary: Get workflow run details
      tags:
      - Workflows
      x-cortex-mcp-description: Get one workflow run by its id, including the outcome of each action in it. Use listWorkflowRuns to find the run id. Poll while the status is NOT_INITIATED or IN_PROGRESS. The run context is left out unless includeContext=true.
      x-cortex-mcp-enabled: 'true'
components:
  schemas:
    VariableAssignment:
      required:
      - slug
      - source
      type: object
      properties:
        slug:
          type: string
          description: The slug of the workflow variable to set
        source:
          oneOf:
          - $ref: '#/components/schemas/JavaScript'
          - $ref: '#/components/schemas/Reference'
      description: The variables to set for the action
    WorkflowRunDetailsVariableResponse:
      required:
      - type
      - value
      type: object
      properties:
        type:
          type: string
          description: The type of the variable
        value:
          $ref: '#/components/schemas/JsonNode'
      description: Variable values
    JsonNode:
      type: object
    WorkflowActionSchema.SCAFFOLDER:
      title: SCAFFOLDER
      type: object
      allOf:
      - $ref: '#/components/schemas/WorkflowActionSchema'
      - required:
        - inputOverrides
        - type
        type: object
        properties:
          createNewRepository:
            type: boolean
            description: Whether the Scaffolder should create a new repository. Defaults to `true`
          createService:
            type: boolean
            description: Whether the cortex service should be created.
          inputOverrides:
            type: array
            description: The input overrides for the Scaffolder
            items:
              $ref: '#/components/schemas/InputOverride'
          scaffolderTemplateId:
            type: string
            description: On input, accepts either the tag or the Cortex ID of the Scaffolder template. On output, always the template's Cortex ID, or `null` if the referenced template was deleted.
          scaffolderTemplateTag:
            type: string
            description: The tag of the Scaffolder template. Preferred over `scaffolderTemplateId` when both are provided, so workflow definitions stay portable across workspaces.
          type:
            type: string
    ErrorResponse:
      required:
      - message
      - type
      type: object
      properties:
        details:
          type: string
        errorCode:
          type: string
        gatewayHttpStatus:
          type: integer
          format: int32
        httpStatus:
          type: integer
          format: int32
        message:
          type: string
        requestId:
          type: string
        type:
          type: string
          enum:
          - INTEGRATION_MISSING
          - INTEGRATION_UNREGISTERED
          - INTEGRATION_UNSUPPORTED
          - INTEGRATION_GRAPHQL_ERROR
          - INTEGRATION_BAD_REQUEST
          - INTEGRATION_UNAUTHORIZED
          - INTEGRATION_FORBIDDEN
          - INTEGRATION_NOT_FOUND
          - INTEGRATION_UNPROCESSABLE_CONTENT
          - INTEGRATION_RATE_LIMITED
          - INTEGRATION_INTERNAL_ERROR
          - INTEGRATION_NOT_IMPLEMENTED
          - INTEGRATION_BAD_GATEWAY
          - INTEGRATION_UNAVAILABLE
          - INTEGRATION_GATEWAY_TIMEOUT
          - INTEGRATION_TIMED_OUT
          - INTEGRATION_CACHE_ERROR
          - INTEGRATION_UNHANDLED_HTTP_ERROR
          - INTEGRATION_UNHANDLED_EXCEPTION
          - INTEGRATION_UNEXPECTED_ERROR
          - ILLEGAL_ARGUMENT_ERROR
          - BAD_REQUEST
          - FORBIDDEN
          - NOT_FOUND
          - REQUEST_TIMEOUT
          - CONFLICT
          - UNHANDLED_EXCEPTION
          - UNCATEGORIZED
          - SERVICE_CREATOR
          - UNKNOWN_HOST
          - TOO_MANY_REQUESTS
    WorkflowActionSchema.CONDITIONAL_BRANCH:
      title: CONDITIONAL_BRANCH
      type: object
      allOf:
      - $ref: '#/components/schemas/WorkflowActionSchema'
      - required:
        - branches
        - type
        type: object
        properties:
          branches:
            type: array
            description: The list of conditional branches that will be evaluated in order. Each result is at `actions.<slug>.outputs.conditions.<branchSlug>.result`.
            items:
              $ref: '#/components/schemas/Conditional'
          fallbackBranch:
            $ref: '#/components/schemas/Fallback'
          joiningAction:
            type: string
            description: The slug of the action where the branch paths join again. Leave it out if they do not join.
          type:
            type: string
    WorkflowRunActionState.NotInitiated:
      title: NotInitiated
      type: object
      allOf:
      - $ref: '#/components/schemas/WorkflowRunActionState'
    WorkflowInput.SELECT_FIELD:
      title: SELECT_FIELD
      type: object
      allOf:
      - $ref: '#/components/schemas/WorkflowInput'
      - required:
        - allowAdditionalOptions
        - key
        - name
        - options
        - required
        - type
        type: object
        properties:
          allowAdditionalOptions:
            type: boolean
            description: Whether additional options are allowed. Defaults to `false`
          defaultValue:
            type: string
            description: The default value for the input
          description:
            type: string
            description: The description of the input
          key:
            type: string
            description: The key of the input
          name:
            type: string
            description: The name of the input
          options:
            type: array
            description: The list of options for the input
            items:
              type: string
              description: The list of options for the input
          optionsLabels:
            type: array
            description: The list of labels for the options. If not provided, the options will be used as labels
            items:
              type: string
              description: The list of labels for the options. If not provided, the options will be used as labels
          placeholder:
            type: string
            description: The placeholder value for the input
          required:
            type: boolean
            description: Whether the input is required
          type:
            type: string
    WorkflowRunScopeRequest.ENTITY:
      title: ENTITY
      type: object
      allOf:
      - $ref: '#/components/schemas/WorkflowRunScopeRequest'
      - required:
        - entityId
        - type
        type: object
        properties:
          entityId:
            type: string
            description: The tag or CID of the entity to run the workflow on
          type:
            type: string
    WorkflowRunRequest:
      required:
      - scope
      type: object
      properties:
        initialContext:
          $ref: '#/components/schemas/JsonNode'
        notificationRecipients:
          type: array
          description: List of email addresses to notify of workflow updates.
          items:
            type: string
            description: List of email addresses to notify of workflow updates.
        runAs:
          type: string
          description: User's email to run the workflow as
        scope:
          $ref: '#/components/schemas/WorkflowRunScopeRequest'
    WorkflowInput.NUMBER_FIELD:
      title: NUMBER_FIELD
      type: object
      allOf:
      - $ref: '#/components/schemas/WorkflowInput'
      - required:
        - disabled
        - format
        - key
        - name
        - required
        - type
        type: object
        properties:
          defaultValue:
            type: number
            description: The default value for the input
          description:
            type: string
            description: The description of the input
          disabled:
            type: boolean
            description: Whether the input should be disabled
          format:
            type: string
            description: The number format of the input
            enum:
            - INTEGER
            - DECIMAL
          key:
            type: string
            description: The key of the input
          max:
            type: number
            description: The maximum value of the input
          min:
            type: number
            description: The minimum value of the input
          name:
            type: string
            description: The name of the input
          placeholder:
            type: string
            description: The placeholder for the input
          required:
            type: boolean
            description: Whether the input is required
          type:
            type: string
    WorkflowVariable:
      required:
      - slug
      - type
      type: object
      properties:
        defaultValue:
          $ref: '#/components/schemas/JsonNode'
        description:
          type: string
          description: The description of the variable
        slug:
          type: string
          description: The slug of the variable. Use lowercase letters, digits and hyphens, 2 to 255 characters, not starting or ending with a hyphen.
        type:
          type: string
          description: The type of the variable
          enum:
          - STRING
          - NUMBER
          - BOOLEAN
          - OBJECT
          - ARRAY_OF_STRING
          - ARRAY_OF_NUMBER
          - ARRAY_OF_BOOLEAN
          - ARRAY_OF_OBJECT
      description: List of variable definitions for the workflow. Set run values with `initialContext`.
    WorkflowRunActionState.InProgress:
      title: InProgress
      type: object
      allOf:
      - $ref: '#/components/schemas/WorkflowRunActionState'
      - type: object
        properties:
          inputs:
            type: object
            additionalProperties:
              $ref: '#/components/schemas/JsonNode'
            description: Inputs for the action
          metadata:
            type: object
            additionalProperties:
              $ref: '#/components/schemas/JsonNode'
            description: Metadata from the action run
          outputs:
            type: object
            additionalProperties:
              $ref: '#/components/schemas/JsonNode'
            description: Outputs from the action
          variables:
            type: object
            additionalProperties:
              $ref: '#/components/schemas/JsonNode'
            description: Variables from the action run
    JavaScript:
      type: object
      allOf:
      - $ref: '#/components/schemas/VariableSource'
      - required:
        - script
        - type
        type: object
        properties:
          script:
            type: string
            description: The JavaScript script that returns the value. It runs as the body of `run(actions, context, variables)`.
          type:
            type: string
    WorkflowSummary:
      required:
      - cid
      - name
      type: object
      properties:
        cid:
          type: string
          description: The id of the workflow
        name:
          type: string
          description: The slug of the workflow
      description: Summary of the workflow
    WorkflowRunDetailsResponse:
      required:
      - actions
      - id
      - status
      - variables
      - workflow
      type: object
      properties:
        actions:
          type: array
          description: Actions and their states
          items:
            $ref: '#/components/schemas/ActionRunDetailsResponse'
        completedAt:
          type: string
          description: Time the workflow run completed
        context:
          type: object
          additionalProperties:
            type: object
            description: Context of the run. Omitted when the request sets `includeContext=false`, which is the default for MCP clients.
          description: Context of the run. Omitted when the request sets `includeContext=false`, which is the default for MCP clients.
        id:
          type: string
          description: Id of the run
        initiatedBy:
          oneOf:
          - $ref: '#/components/schemas/ApiKey'
          - $ref: '#/components/schemas/User'
        runResponse:
          type: string
        startedAt:
          type: string
          description: Time the workflow run started
        status:
          type: string
          description: Status of the workflow run. `PAUSED` means it waits for a user input or an approval.
          enum:
          - NOT_INITIATED
          - IN_PROGRESS
          - PAUSED
          - COMPLETED
          - FAILED
          - CANCELLED
          - TIMED_OUT
        variables:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/WorkflowRunDetailsVariableResponse'
          description: Variable values
        workflow:
